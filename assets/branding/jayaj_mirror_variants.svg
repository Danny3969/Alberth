<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#0A0D14" rx="24"/>

  <!-- Eje Central Global (Dashed Golden Ratio Line) -->
  <line x1="500" y1="50" x2="500" y2="750" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>
  <text x="500" y="40" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D4AF37" opacity="0.6" letter-spacing="4">EJE DE SIMETRÍA AXIAL (CENTRO Y)</text>

  <!-- ========================================== -->
  <!-- VARIANTE 1: SIMETRÍA ESPECULAR (GANCHOS AFUERA) -->
  <!-- ========================================== -->
  <g transform="translate(0, 80)">
    <rect x="50" y="20" width="900" height="190" fill="#0F1420" rx="16" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Etiqueta -->
    <text x="80" y="55" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D4AF37" letter-spacing="3">VARIANTE 1 · SIMETRÍA ESPECULAR BILATERAL (RECOMENDADA)</text>
    <text x="80" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">J inicial hacia la izquierda · J final en espejo hacia la derecha. Balance axial perfecto respecto a la Y.</text>

    <!-- Render Tipográfico Vectorial Puro -->
    <g transform="translate(500, 155)">
      <!-- J Inicial (Gancho Izquierda) -->
      <path d="M -160,-40 L -142,-40 L -142,15 C -142,32 -158,40 -178,40 C -195,40 -206,30 -206,16 L -190,16 C -190,22 -185,26 -178,26 C -166,26 -160,20 -160,15 Z" fill="url(#platGrad)"/>
      <rect x="-206" y="-40" width="64" height="10" rx="2" fill="url(#platGrad)"/>

      <!-- A Izquierda -->
      <path d="M -115,40 L -75,-40 L -60,-40 L -20,40 L -38,40 L -46,22 L -89,22 L -97,40 Z M -51,10 L -67,-24 L -84,10 Z" fill="url(#platGrad)"/>

      <!-- Y Central -->
      <path d="M -22,-40 L 0,-2 L 22,-40 L 40,-40 L 9,9 L 9,40 L -9,40 L -9,9 L -40,-40 Z" fill="url(#goldGrad)"/>

      <!-- A Derecha (Simétrica) -->
      <path d="M 20,40 L 60,-40 L 75,-40 L 115,40 L 97,40 L 89,22 L 46,22 L 38,40 Z M 84,10 L 67,-24 L 51,10 Z" fill="url(#platGrad)"/>

      <!-- J Final Reflejada (Gancho Derecha - Espejo Puro) -->
      <g transform="scale(-1, 1)">
        <path d="M -160,-40 L -142,-40 L -142,15 C -142,32 -158,40 -178,40 C -195,40 -206,30 -206,16 L -190,16 C -190,22 -185,26 -178,26 C -166,26 -160,20 -160,15 Z" fill="url(#platGrad)"/>
        <rect x="-206" y="-40" width="64" height="10" rx="2" fill="url(#platGrad)"/>
      </g>
    </g>

    <!-- Descriptor -->
    <text x="500" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" letter-spacing="8">VENTURE HOLDING</text>
  </g>

  <!-- ========================================== -->
  <!-- VARIANTE 2: SIMETRÍA ENVOLVENTE (GANCHOS ADENTRO) -->
  <!-- ========================================== -->
  <g transform="translate(0, 310)">
    <rect x="50" y="20" width="900" height="190" fill="#0F1420" rx="16" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Etiqueta -->
    <text x="80" y="55" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D4AF37" letter-spacing="3">VARIANTE 2 · SIMETRÍA ENVOLVENTE (EL ABRAZO INSTITUCIONAL)</text>
    <text x="80" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Ambas J se miran hacia adentro. Efecto de custodia, blindaje y caja fuerte de inversiones.</text>

    <!-- Render Tipográfico Vectorial Puro -->
    <g transform="translate(500, 155)">
      <!-- J Inicial Invertida (Mira a la derecha) -->
      <g transform="scale(-1, 1)">
        <g transform="translate(366, 0)">
          <path d="M -160,-40 L -142,-40 L -142,15 C -142,32 -158,40 -178,40 C -195,40 -206,30 -206,16 L -190,16 C -190,22 -185,26 -178,26 C -166,26 -160,20 -160,15 Z" fill="url(#platGrad)"/>
          <rect x="-206" y="-40" width="64" height="10" rx="2" fill="url(#platGrad)"/>
        </g>
      </g>

      <!-- A Izquierda -->
      <path d="M -115,40 L -75,-40 L -60,-40 L -20,40 L -38,40 L -46,22 L -89,22 L -97,40 Z M -51,10 L -67,-24 L -84,10 Z" fill="url(#platGrad)"/>

      <!-- Y Central -->
      <path d="M -22,-40 L 0,-2 L 22,-40 L 40,-40 L 9,9 L 9,40 L -9,40 L -9,9 L -40,-40 Z" fill="url(#goldGrad)"/>

      <!-- A Derecha -->
      <path d="M 20,40 L 60,-40 L 75,-40 L 115,40 L 97,40 L 89,22 L 46,22 L 38,40 Z M 84,10 L 67,-24 L 51,10 Z" fill="url(#platGrad)"/>

      <!-- J Final Estándar (Mira a la izquierda) -->
      <g transform="translate(366, 0)">
        <path d="M -160,-40 L -142,-40 L -142,15 C -142,32 -158,40 -178,40 C -195,40 -206,30 -206,16 L -190,16 C -190,22 -185,26 -178,26 C -166,26 -160,20 -160,15 Z" fill="url(#platGrad)"/>
        <rect x="-206" y="-40" width="64" height="10" rx="2" fill="url(#platGrad)"/>
      </g>
    </g>

    <!-- Descriptor -->
    <text x="500" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" letter-spacing="8">VENTURE HOLDING</text>
  </g>

  <!-- ========================================== -->
  <!-- VARIANTE 3: COMPARATIVA FRENTE A ORIGINAL ASIMÉTRICA -->
  <!-- ========================================== -->
  <g transform="translate(0, 540)">
    <rect x="50" y="20" width="900" height="190" fill="#0F1420" rx="16" stroke="#1E293B" stroke-width="1" opacity="0.7"/>
    
    <!-- Etiqueta -->
    <text x="80" y="55" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748B" letter-spacing="3">REFERENCIA ORIGINAL (CON J ESTÁNDAR AL FINAL)</text>
    <text x="80" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B">Tipografía tradicional donde ambas J miran hacia la izquierda (asimetría direccional).</text>

    <!-- Render Tipográfico Vectorial Puro -->
    <g transform="translate(500, 155)">
      <!-- J Inicial -->
      <path d="M -160,-40 L -142,-40 L -142,15 C -142,32 -158,40 -178,40 C -195,40 -206,30 -206,16 L -190,16 C -190,22 -185,26 -178,26 C -166,26 -160,20 -160,15 Z" fill="#64748B"/>
      <rect x="-206" y="-40" width="64" height="10" rx="2" fill="#64748B"/>

      <!-- A Izquierda -->
      <path d="M -115,40 L -75,-40 L -60,-40 L -20,40 L -38,40 L -46,22 L -89,22 L -97,40 Z M -51,10 L -67,-24 L -84,10 Z" fill="#64748B"/>

      <!-- Y Central -->
      <path d="M -22,-40 L 0,-2 L 22,-40 L 40,-40 L 9,9 L 9,40 L -9,40 L -9,9 L -40,-40 Z" fill="#94A3B8"/>

      <!-- A Derecha -->
      <path d="M 20,40 L 60,-40 L 75,-40 L 115,40 L 97,40 L 89,22 L 46,22 L 38,40 Z M 84,10 L 67,-24 L 51,10 Z" fill="#64748B"/>

      <!-- J Final Estándar -->
      <g transform="translate(366, 0)">
        <path d="M -160,-40 L -142,-40 L -142,15 C -142,32 -158,40 -178,40 C -195,40 -206,30 -206,16 L -190,16 C -190,22 -185,26 -178,26 C -166,26 -160,20 -160,15 Z" fill="#64748B"/>
        <rect x="-206" y="-40" width="64" height="10" rx="2" fill="#64748B"/>
      </g>
    </g>

    <!-- Descriptor -->
    <text x="500" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569" letter-spacing="8">VENTURE HOLDING</text>
  </g>
</svg>
