<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldUnified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>
    <linearGradient id="platUnified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#0A0D14" rx="20"/>

  <text x="600" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#D4AF37" letter-spacing="6">ESTUDIO DE REDISEÑO DEL ISOTIPO · Y CONTINUA UNIFICADA (SIN CORTE V+I)</text>
  <line x1="150" y1="65" x2="1050" y2="65" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- ==================== OPCIÓN 1: Y MONOLÍTICA PURA (RECOMENDADA) ==================== -->
  <g transform="translate(200, 250)">
    <rect x="-160" y="-160" width="320" height="340" fill="#0F1420" rx="16" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="-125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D4AF37" letter-spacing="2">OPCIÓN 1 · MONOLITO CONTINUO</text>
    <text x="0" y="-105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Un solo trazo perimetral contiguo</text>

    <!-- Isotipo Completo -->
    <g transform="translate(0, 15)">
      <!-- Y Unificada Continua (Single Contiguous Path) -->
      <path d="M -56,-115 L -10,-24 L -10,65 L 10,65 L 10,-24 L 56,-115 L 34,-115 L 0,-48 L -34,-115 Z" fill="url(#goldUnified)"/>

      <!-- J Izquierda Espejo -->
      <path d="M -38,-85 L -19,-85 L -19,25 C -19,55 -46,65 -74,65 C -96,65 -112,47 -112,25 L -92,25 C -92,36 -84,45 -74,45 C -52,45 -38,36 -38,25 Z" fill="url(#platUnified)"/>
      <rect x="-112" y="-85" width="93" height="14" rx="3" fill="url(#platUnified)"/>

      <!-- J Derecha Directa -->
      <path d="M 38,-85 L 19,-85 L 19,25 C 19,55 46,65 74,65 C 96,65 112,47 112,25 L 92,25 C 92,36 84,45 74,45 C 52,45 38,36 38,25 Z" fill="url(#platUnified)"/>
      <rect x="19" y="-85" width="93" height="14" rx="3" fill="url(#platUnified)"/>
    </g>

    <text x="0" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" letter-spacing="2">✓ CERO COSTURAS · MÁXIMA ELEGANCIA</text>
  </g>

  <!-- ==================== OPCIÓN 2: Y CON BISEL CENTRAL (CHAMFER) ==================== -->
  <g transform="translate(600, 250)">
    <rect x="-160" y="-160" width="320" height="340" fill="#0F1420" rx="16" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="-125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D4AF37" letter-spacing="2">OPCIÓN 2 · HORQUILLA BISELADA</text>
    <text x="0" y="-105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Vértice interior con meseta de apoyo</text>

    <!-- Isotipo Completo -->
    <g transform="translate(0, 15)">
      <!-- Y Unificada con Base Interior de 8px -->
      <path d="M -56,-115 L -10,-24 L -10,65 L 10,65 L 10,-24 L 56,-115 L 34,-115 L 5,-52 L -5,-52 L -34,-115 Z" fill="url(#goldUnified)"/>

      <!-- J Izquierda Espejo -->
      <path d="M -38,-85 L -19,-85 L -19,25 C -19,55 -46,65 -74,65 C -96,65 -112,47 -112,25 L -92,25 C -92,36 -84,45 -74,45 C -52,45 -38,36 -38,25 Z" fill="url(#platUnified)"/>
      <rect x="-112" y="-85" width="93" height="14" rx="3" fill="url(#platUnified)"/>

      <!-- J Derecha Directa -->
      <path d="M 38,-85 L 19,-85 L 19,25 C 19,55 46,65 74,65 C 96,65 112,47 112,25 L 92,25 C 92,36 84,45 74,45 C 52,45 38,36 38,25 Z" fill="url(#platUnified)"/>
      <rect x="19" y="-85" width="93" height="14" rx="3" fill="url(#platUnified)"/>
    </g>

    <text x="0" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0EA5E9" letter-spacing="2">✓ ASENTAMIENTO DE INGENIERÍA</text>
  </g>

  <!-- ==================== OPCIÓN 3: ANTES (PARA COMPARAR EL DEFECTO) ==================== -->
  <g transform="translate(1000, 250)">
    <rect x="-160" y="-160" width="320" height="340" fill="#0F1420" rx="16" stroke="#EF4444" stroke-width="1" opacity="0.6"/>
    <text x="0" y="-125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#EF4444" letter-spacing="2">VERSIÓN ANTERIOR (EL PROBLEMA)</text>
    <text x="0" y="-105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#EF4444">Dos piezas separadas: V sobre I</text>

    <!-- Isotipo Anterior Desconectado -->
    <g transform="translate(0, 15)">
      <!-- V flotante separada -->
      <path d="M -56,-115 L 0,-35 L 56,-115 L 30,-115 L 0,-75 L -30,-115 Z" fill="url(#goldUnified)"/>
      <!-- I tronco separado -->
      <path d="M -8,-35 L 8,-35 L 8,65 L -8,65 Z" fill="url(#goldUnified)"/>

      <!-- J Izquierda Espejo -->
      <path d="M -38,-85 L -19,-85 L -19,25 C -19,55 -46,65 -74,65 C -96,65 -112,47 -112,25 L -92,25 C -92,36 -84,45 -74,45 C -52,45 -38,36 -38,25 Z" fill="url(#platUnified)"/>
      <rect x="-112" y="-85" width="93" height="14" rx="3" fill="url(#platUnified)"/>

      <!-- J Derecha Directa -->
      <path d="M 38,-85 L 19,-85 L 19,25 C 19,55 46,65 74,65 C 96,65 112,47 112,25 L 92,25 C 92,36 84,45 74,45 C 52,45 38,36 38,25 Z" fill="url(#platUnified)"/>
      <rect x="19" y="-85" width="93" height="14" rx="3" fill="url(#platUnified)"/>
    </g>

    <text x="0" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444" letter-spacing="2">✗ CORTE DISCONTINUO VISIBLE</text>
  </g>
</svg>
