<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>
    <linearGradient id="hPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Background Obsidian -->
  <rect width="1100" height="280" fill="#0A0D14" rx="16"/>

  <!-- ISOTIPO IZQUIERDA (JYJ Monograma) -->
  <g transform="translate(160, 140)">
    <!-- Vector Central Y -->
    <path d="M -35,-70 L 0,-20 L 35,-70 L 18,-70 L 0,-44 L -18,-70 Z" fill="url(#hGold)"/>
    <path d="M -6,-20 L 6,-20 L 6,38 L -6,38 Z" fill="url(#hGold)"/>

    <!-- J Izquierda (Pilar y Ala - Espejo) -->
    <path d="M -24,-52 L -12,-52 L -12,18 C -12,36 -30,44 -48,44 C -62,44 -72,32 -72,18 L -59,18 C -59,25 -54,30 -48,30 C -34,30 -24,25 -24,18 Z" fill="url(#hPlatinum)"/>
    <rect x="-72" y="-52" width="60" height="10" rx="2" fill="url(#hPlatinum)"/>

    <!-- J Derecha (Pilar y Ala - Directa) -->
    <path d="M 24,-52 L 12,-52 L 12,18 C 12,36 30,44 48,44 C 62,44 72,32 72,18 L 59,18 C 59,25 54,30 48,30 C 34,30 24,25 24,18 Z" fill="url(#hPlatinum)"/>
    <rect x="12" y="-52" width="60" height="10" rx="2" fill="url(#hPlatinum)"/>
  </g>

  <!-- LÍNEA SEPARADORA VERTICAL -->
  <line x1="285" y1="50" x2="285" y2="230" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- LOGOTIPO DERECHA: J A Y A Ⴑ (Simetría Especular) -->
  <g transform="translate(690, 125)">
    <!-- J Inicial (Gancho Izquierda) -->
    <g transform="translate(-260, 0)">
      <path d="M 24,-45 L 48,-45 L 48,16 C 48,36 28,45 4,45 C -18,45 -36,34 -36,18 L -16,18 C -16,25 -8,30 4,30 C 16,30 22,23 22,16 Z" fill="url(#hPlatinum)"/>
      <rect x="-36" y="-45" width="84" height="12" rx="2" fill="url(#hPlatinum)"/>
    </g>

    <!-- A Izquierda -->
    <g transform="translate(-130, 0)">
      <path d="M -40,45 L -3,-45 L 14,-45 L 50,45 L 30,45 L 22,22 L -22,22 L -30,45 Z M -15,8 L 15,8 L 0,-28 Z" fill="url(#hPlatinum)"/>
    </g>

    <!-- Y Central (Eje Axial y Vector Dorado) -->
    <g transform="translate(0, 0)">
      <path d="M -30,-45 L 0,-4 L 30,-45 L 50,-45 L 12,10 L 12,45 L -12,45 L -12,10 L -50,-45 Z" fill="url(#hGold)"/>
    </g>

    <!-- A Derecha (Simétrica) -->
    <g transform="translate(130, 0)">
      <path d="M -40,45 L -3,-45 L 14,-45 L 50,45 L 30,45 L 22,22 L -22,22 L -30,45 Z M -15,8 L 15,8 L 0,-28 Z" fill="url(#hPlatinum)"/>
    </g>

    <!-- J Final Reflejada (Gancho Derecha - Espejo Puro 180°) -->
    <g transform="translate(260, 0) scale(-1, 1)">
      <path d="M 24,-45 L 48,-45 L 48,16 C 48,36 28,45 4,45 C -18,45 -36,34 -36,18 L -16,18 C -16,25 -8,30 4,30 C 16,30 22,23 22,16 Z" fill="url(#hPlatinum)"/>
      <rect x="-36" y="-45" width="84" height="12" rx="2" fill="url(#hPlatinum)"/>
    </g>

    <!-- Descriptor Horizontal -->
    <text x="0" y="85" 
          text-anchor="middle" 
          font-family="'JetBrains Mono', 'SF Pro Text', monospace" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="14" 
          fill="url(#hGold)">
      VENTURE HOLDING
    </text>
  </g>
</svg>
