<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="isoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>
    <linearGradient id="isoPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Isotipo Centrado Monograma Simétrico JYJ (Y Monolítica Continua Unificada) -->
  <g transform="translate(200, 200)">
    <!-- Vector Central Y: Trazo único continuo monolítico (sin corte V sobre I) -->
    <path d="M -56,-115 L -10,-24 L -10,65 L 10,65 L 10,-24 L 56,-115 L 34,-115 L 0,-48 L -34,-115 Z" fill="url(#isoGold)"/>

    <!-- J Izquierda (Pilar y Ala Protectora - Espejo) -->
    <path d="M -38,-85 L -19,-85 L -19,25 C -19,55 -46,65 -74,65 C -96,65 -112,47 -112,25 L -92,25 C -92,36 -84,45 -74,45 C -52,45 -38,36 -38,25 Z" fill="url(#isoPlatinum)"/>
    <rect x="-112" y="-85" width="93" height="14" rx="3" fill="url(#isoPlatinum)"/>

    <!-- J Derecha (Pilar y Ala Protectora - Directa) -->
    <path d="M 38,-85 L 19,-85 L 19,25 C 19,55 46,65 74,65 C 96,65 112,47 112,25 L 92,25 C 92,36 84,45 74,45 C 52,45 38,36 38,25 Z" fill="url(#isoPlatinum)"/>
    <rect x="19" y="-85" width="93" height="14" rx="3" fill="url(#isoPlatinum)"/>
  </g>
</svg>
