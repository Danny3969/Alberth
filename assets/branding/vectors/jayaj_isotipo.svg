<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="isoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>
    <linearGradient id="isoPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo Centrado Monograma Simétrico JYJ -->
  <g transform="translate(200, 200)">
    <!-- Vector Central Y (Ascenso, Multiplicador, Inversión) -->
    <!-- Ramas Superiores de la Y -->
    <path d="M -60,-120 L 0,-35 L 60,-120 L 32,-120 L 0,-75 L -32,-120 Z" fill="url(#isoGold)"/>
    <!-- Tronco de la Y -->
    <path d="M -9,-35 L 9,-35 L 9,65 L -9,65 Z" fill="url(#isoGold)"/>

    <!-- J Izquierda (Pilar y Ala Protectora - Espejo) -->
    <path d="M -42,-90 L -21,-90 L -21,30 C -21,62 -52,74 -82,74 C -108,74 -125,54 -125,30 L -103,30 C -103,42 -94,52 -82,52 C -58,52 -42,42 -42,30 Z" fill="url(#isoPlatinum)"/>
    <rect x="-125" y="-90" width="104" height="16" rx="4" fill="url(#isoPlatinum)"/>

    <!-- J Derecha (Pilar y Ala Protectora - Directa) -->
    <path d="M 42,-90 L 21,-90 L 21,30 C 21,62 52,74 82,74 C 108,74 125,54 125,30 L 103,30 C 103,42 94,52 82,52 C 58,52 42,42 42,30 Z" fill="url(#isoPlatinum)"/>
    <rect x="21" y="-90" width="104" height="16" rx="4" fill="url(#isoPlatinum)"/>
  </g>
</svg>
