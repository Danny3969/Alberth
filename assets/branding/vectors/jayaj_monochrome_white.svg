<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <!-- Versión Monocromática Blanco Puro (100% White on Transparent) -->
  <g fill="#FFFFFF">
    <!-- ISOTIPO CON Y UNIFICADA CONTINUA -->
    <g transform="translate(140, 150)">
      <!-- Vector Central Y: Trazo único continuo monolítico -->
      <path d="M -28,-57 L -5,-12 L -5,32 L 5,32 L 5,-12 L 28,-57 L 17,-57 L 0,-24 L -17,-57 Z"/>
      <!-- J Izquierda Espejo -->
      <path d="M -19,-42 L -9,-42 L -9,12 C -9,27 -23,32 -37,32 C -48,32 -56,23 -56,12 L -46,12 C -46,18 -42,22 -37,22 C -26,22 -19,18 -19,12 Z"/>
      <rect x="-56" y="-42" width="47" height="7" rx="2"/>
      <!-- J Derecha Directa -->
      <path d="M 19,-42 L 9,-42 L 9,12 C 9,27 23,32 37,32 C 48,32 56,23 56,12 L 46,12 C 46,18 42,22 37,22 C 26,22 19,18 19,12 Z"/>
      <rect x="9" y="-42" width="47" height="7" rx="2"/>
    </g>

    <line x1="240" y1="60" x2="240" y2="240" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

    <!-- LOGOTIPO JAYAJ CON J EN ESPEJO -->
    <g transform="translate(630, 135)">
      <!-- J Inicial -->
      <g transform="translate(-230, 0)">
        <path d="M 21,-40 L 42,-40 L 42,14 C 42,32 24,40 3,40 C -16,40 -32,30 -32,16 L -14,16 C -14,22 -7,27 3,27 C 14,27 19,20 19,14 Z"/>
        <rect x="-32" y="-40" width="74" height="11" rx="2"/>
      </g>
      <!-- A Izquierda -->
      <g transform="translate(-115, 0)">
        <path d="M -35,40 L -3,-40 L 12,-40 L 44,40 L 26,40 L 19,20 L -19,20 L -26,40 Z M -13,7 L 13,7 L 0,-25 Z"/>
      </g>
      <!-- Y Central -->
      <g transform="translate(0, 0)">
        <path d="M -26,-40 L 0,-4 L 26,-40 L 44,-40 L 10,9 L 10,40 L -10,40 L -10,9 L -44,-40 Z"/>
      </g>
      <!-- A Derecha -->
      <g transform="translate(115, 0)">
        <path d="M -35,40 L -3,-40 L 12,-40 L 44,40 L 26,40 L 19,20 L -19,20 L -26,40 Z M -13,7 L 13,7 L 0,-25 Z"/>
      </g>
      <!-- J Final Reflejada -->
      <g transform="translate(230, 0) scale(-1, 1)">
        <path d="M 21,-40 L 42,-40 L 42,14 C 42,32 24,40 3,40 C -16,40 -32,30 -32,16 L -14,16 C -14,22 -7,27 3,27 C 14,27 19,20 19,14 Z"/>
        <rect x="-32" y="-40" width="74" height="11" rx="2"/>
      </g>

      <text x="0" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="12">VENTURE HOLDING</text>
    </g>
  </g>
</svg>
