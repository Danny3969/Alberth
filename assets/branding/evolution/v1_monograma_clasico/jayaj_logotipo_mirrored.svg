<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>
    <linearGradient id="logoPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Logotipo Monolítico: J A Y A Ⴑ (Simetría Especular Bilateral) -->
  <g transform="translate(450, 120)">
    <!-- J Inicial (Gancho Izquierda) -->
    <g transform="translate(-320, 0)">
      <path d="M 30,-70 L 60,-70 L 60,25 C 60,55 35,70 5,70 C -25,70 -50,52 -50,28 L -22,28 C -22,38 -12,45 5,45 C 24,45 32,35 32,25 Z" fill="url(#logoPlatinum)"/>
      <rect x="-50" y="-70" width="110" height="20" rx="3" fill="url(#logoPlatinum)"/>
    </g>

    <!-- A Izquierda -->
    <g transform="translate(-160, 0)">
      <path d="M -60,70 L -5,-70 L 20,-70 L 75,70 L 46,70 L 32,35 L -32,35 L -46,70 Z M -23,12 L 23,12 L 0,-44 Z" fill="url(#logoPlatinum)"/>
    </g>

    <!-- Y Central (Eje Axial y Vector Áureo) -->
    <g transform="translate(0, 0)">
      <path d="M -45,-70 L 0,-6 L 45,-70 L 76,-70 L 17,16 L 17,70 L -17,70 L -17,16 L -76,-70 Z" fill="url(#logoGold)"/>
    </g>

    <!-- A Derecha (Simétrica) -->
    <g transform="translate(160, 0)">
      <path d="M -60,70 L -5,-70 L 20,-70 L 75,70 L 46,70 L 32,35 L -32,35 L -46,70 Z M -23,12 L 23,12 L 0,-44 Z" fill="url(#logoPlatinum)"/>
    </g>

    <!-- J Final Reflejada (Gancho Derecha - Espejo Puro 180°) -->
    <g transform="translate(320, 0) scale(-1, 1)">
      <path d="M 30,-70 L 60,-70 L 60,25 C 60,55 35,70 5,70 C -25,70 -50,52 -50,28 L -22,28 C -22,38 -12,45 5,45 C 24,45 32,35 32,25 Z" fill="url(#logoPlatinum)"/>
      <rect x="-50" y="-70" width="110" height="20" rx="3" fill="url(#logoPlatinum)"/>
    </g>
  </g>
</svg>
