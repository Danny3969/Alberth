<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente Champaña Oro Cepillado -->
    <linearGradient id="goldTechB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997812"/>
    </linearGradient>

    <!-- Gradiente Titanio Platino -->
    <linearGradient id="titaniumTechB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Fondo Obsidiana de Alto Contraste -->
  <rect width="400" height="400" fill="#0A0D14" rx="28"/>

  <!-- ========================================================
       OPCIÓN B: "EL NÚCLEO SINGULAR / GLIFO BILATERAL"
       - Inspiración: Polestar, OpenAI, Nothing Tech.
       - Trazos continuos sin adornos, tensión magnética limpia.
       - Silueta totalmente aerodinámica e inmune al efecto "M".
       ======================================================== -->
  <g transform="translate(200, 200)">
    <!-- Y Central: Núcleo en Diamante / Vuelo Ascendente Monolítico -->
    <path d="M 0,-100 L 22,-52 L 7,-52 L 7,65 L -7,65 L -7,-52 L -22,-52 Z" fill="url(#goldTechB)"/>

    <!-- J Izquierda Espejo: Trazo continuo fluido y dinámico -->
    <path d="M -50,-85 C -38,-85 -32,-78 -32,-66 L -32,15 C -32,55 -60,75 -95,75 C -125,75 -135,56 -135,35 L -116,35 C -116,46 -108,58 -95,58 C -72,58 -52,44 -52,15 L -52,-66 C -52,-78 -58,-85 -50,-85 Z" fill="url(#titaniumTechB)"/>

    <!-- Ⴑ Derecha Directa: Simetría Especular Pura -->
    <path d="M 50,-85 C 38,-85 32,-78 32,-66 L 32,15 C 32,55 60,75 95,75 C 125,75 135,56 135,35 L 116,35 C 116,46 108,58 95,58 C 72,58 52,44 52,15 L 52,-66 C 52,-78 58,-85 50,-85 Z" fill="url(#titaniumTechB)"/>

    <!-- Acentos de Precisión Tecnológica (Orbes de Coordenadas) -->
    <circle cx="0" cy="-115" r="4" fill="#D4AF37"/>
    <circle cx="0" cy="85" r="4" fill="#E2E8F0"/>
  </g>
</svg>
