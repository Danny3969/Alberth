<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Gradientes de la Imagen Base del Usuario -->
    <linearGradient id="techBlueViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Gradiente Platino Luminoso -->
    <linearGradient id="platLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Gradiente Champaña / Oro de Autor -->
    <linearGradient id="authorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>

  <!-- Fondo Azul Profundo según la paleta del usuario (#06122D) -->
  <rect width="1200" height="900" fill="#06122D" rx="20"/>

  <!-- Título del Estudio -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="rgba(0, 102, 255, 0.15)" stroke="#0066FF" stroke-width="1"/>
    <text x="80" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2">ESTUDIO DE FUSIÓN</text>

    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      Validación de Tipografía para la Letra "J" en JAYAJ
    </text>
    <text x="0" y="92" font-family="-apple-system, sans-serif" font-size="14" fill="#94A3B8">
      Contraste entre la tipografía base (Montserrat) y las tipografías de autor desarrolladas para la "J" inicial y final en espejo (Ⴑ).
    </text>
  </g>

  <!-- ========================================================
       BLOQUE 1: COMPARATIVA ANATÓMICA DE LA LETRA "J"
       ======================================================== -->
  <g transform="translate(60, 180)">
    <!-- TARJETA A: Montserrat (De la imagen enviada) -->
    <g transform="translate(0, 0)">
      <rect width="330" height="260" rx="16" fill="#0A1838" stroke="#1E2E55" stroke-width="1"/>
      <rect x="20" y="18" width="130" height="20" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
      <text x="28" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F87171" letter-spacing="1">BASE: MONTSERRAT</text>

      <!-- Letra J simple sin remate -->
      <g transform="translate(165, 125)">
        <path d="M 16,-50 L 16,10 C 16,30 2,42 -18,42 C -32,42 -44,34 -44,22 L -32,22 C -32,28 -24,32 -18,32 C -4,32 4,24 4,10 L 4,-50 Z" fill="#94A3B8"/>
      </g>
      <text x="165" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" font-weight="600">Bastón Genérico sin Remate</text>
      <text x="165" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Al invertirse parece una "L" (JAYAL).</text>
      <text x="165" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#EF4444">Falta de autoridad y personalidad.</text>
    </g>

    <!-- TARJETA B: Tipografía con Remate Arquitectónico (Estudio Espejo Original) -->
    <g transform="translate(370, 0)">
      <rect width="330" height="260" rx="16" fill="#0C1F48" stroke="#0066FF" stroke-width="1.5"/>
      <rect x="20" y="18" width="170" height="20" rx="4" fill="rgba(0, 102, 255, 0.25)"/>
      <text x="28" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">OPCIÓN 1 · REMATE CLÁSICO</text>

      <!-- Letra J con Remate Superior y Arco Amplio -->
      <g transform="translate(165, 125)">
        <!-- Barra / Visera Superior -->
        <rect x="-38" y="-50" width="60" height="10" rx="2" fill="url(#techBlueViolet)"/>
        <!-- Fuste y Gancho -->
        <path d="M 6,-50 L 22,-50 L 22,8 C 22,26 8,42 -14,42 C -34,42 -46,28 -46,12 L -30,12 C -30,20 -22,28 -14,28 C -2,28 6,20 6,8 Z" fill="url(#techBlueViolet)"/>
      </g>
      <text x="165" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Con Remate Superior (Serif/Capitel)</text>
      <text x="165" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">La del estudio original de espejo.</text>
      <text x="165" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#38BDF8">Elegante, noble y con estilo monumental.</text>
    </g>

    <!-- TARJETA C: Tipografía con Incisión Cinética a 30° (V3 de Autor) -->
    <g transform="translate(740, 0)">
      <rect width="340" height="260" rx="16" fill="#0C1F48" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect x="20" y="18" width="180" height="20" rx="4" fill="rgba(139, 92, 246, 0.25)"/>
      <text x="28" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C084FC" letter-spacing="1">OPCIÓN 2 · CINÉTICA 30° (V3)</text>

      <!-- Letra J con Corte a 30° y Fuste Monolítico -->
      <g transform="translate(170, 125)">
        <!-- Cabeza con corte a 30° -->
        <polygon points="4,-50 22,-50 10,-65 -8,-65" fill="url(#techBlueViolet)"/>
        <!-- Fuste y Gancho Esculpido -->
        <path d="M 4,-50 L 22,-50 L 22,10 C 22,34 4,44 -18,44 C -40,44 -50,30 -50,14 L -32,14 C -32,22 -24,28 -16,28 C 0,28 4,18 4,10 Z" fill="url(#techBlueViolet)"/>
      </g>
      <text x="170" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Corte Biselado Cinético a 30°</text>
      <text x="170" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Fuste monolítico afilado y gancho circular.</text>
      <text x="170" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#A855F7">Futurista, aerodinámica y de alta tecnología.</text>
    </g>
  </g>

  <!-- ========================================================
       BLOQUE 2: FUSIÓN MAESTRA DEL LOGOTIPO CON LA J EN ESPEJO (Ⴑ)
       SOBRE EL SISTEMA GRÁFICO BASE DEL USUARIO
       ======================================================== -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="360" rx="20" fill="#0A142A" stroke="#1E2E55" stroke-width="1.5"/>

    <!-- Encabezado de la maqueta -->
    <text x="40" y="45" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="3">
      PROPUESTA INTEGRADA · EL LOGOTIPO BILATERAL J A Y A Ⴑ
    </text>
    <text x="40" y="68" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">
      Isotipo 3D Ribbon (de la imagen del usuario) + Wordmark con la J inicial y final estilizadas según nuestra tipografía de autor.
    </text>

    <!-- ISOTIPO 3D RIBBON (RECREACIÓN VECTORIAL DE ALTA FIDELIDAD) -->
    <g transform="translate(540, 150)">
      <!-- Símbolo de Cinta Geométrica 3D Doblada en Azul a Violeta -->
      <!-- Ala / Faceta 1: Azul Profundo Sombra -->
      <polygon points="-30,30 0,60 0,20 -30,-10" fill="#0052CC"/>
      <!-- Ala / Faceta 2: Azul Eléctrico Frontal -->
      <polygon points="-30,-10 0,20 0,-40 -30,-70" fill="#0066FF"/>
      <!-- Ala / Faceta 3: Doblez Superior Violeta Brillante -->
      <polygon points="0,-40 0,20 35,-15 35,-75" fill="#8B5CF6"/>
      <!-- Ala / Faceta 4: Retorno Inferior / Base -->
      <polygon points="0,20 0,60 35,25 35,-15" fill="#6D28D9"/>
      <!-- Reflejo Superior de Luz -->
      <polygon points="-30,-70 0,-40 35,-75 5,-105" fill="#38BDF8" opacity="0.9"/>
    </g>

    <!-- LOGOTIPO J A Y A Ⴑ (HÍBRIDO: J CON ESTILO + A-Y-A SANS GEOMÉTRICA) -->
    <g transform="translate(540, 270)">
      <!-- J INICIAL (Con Remate y Estilo de Autor) -->
      <g transform="translate(-240, 0)">
        <rect x="-30" y="-36" width="46" height="8" rx="2" fill="url(#platLight)"/>
        <path d="M 4,-36 L 16,-36 L 16,6 C 16,20 4,32 -14,32 C -30,32 -38,20 -38,8 L -26,8 C -26,14 -20,20 -14,20 C -4,20 4,14 4,6 Z" fill="url(#platLight)"/>
      </g>

      <!-- A PRIMERA (Sans Geométrica Limpia y Proporcionada) -->
      <g transform="translate(-120, 0)">
        <path d="M 0,-36 L 16,-36 L 38,32 L 24,32 L 18,10 L -18,10 L -24,32 L -38,32 Z M 0,-8 L -12,2 L 12,2 Z" fill="url(#platLight)"/>
      </g>

      <!-- Y CENTRAL (Pivote de Simetría con Gradiente Violeta/Azul) -->
      <g transform="translate(0, 0)">
        <path d="M -30,-36 L -6,2 L -6,32 L 6,32 L 6,2 L 30,-36 L 16,-36 L 0,-8 L -16,-36 Z" fill="url(#techBlueViolet)"/>
      </g>

      <!-- A SEGUNDA (Reflejo Idéntico) -->
      <g transform="translate(120, 0)">
        <path d="M 0,-36 L 16,-36 L 38,32 L 24,32 L 18,10 L -18,10 L -24,32 L -38,32 Z M 0,-8 L -12,2 L 12,2 Z" fill="url(#platLight)"/>
      </g>

      <!-- Ⴑ FINAL EN ESPEJO (Misma tipografía con remate, girada en espejo hacia afuera) -->
      <g transform="translate(240, 0) scale(-1, 1)">
        <rect x="-30" y="-36" width="46" height="8" rx="2" fill="url(#platLight)"/>
        <path d="M 4,-36 L 16,-36 L 16,6 C 16,20 4,32 -14,32 C -30,32 -38,20 -38,8 L -26,8 C -26,14 -20,20 -14,20 C -4,20 4,14 4,6 Z" fill="url(#platLight)"/>
      </g>
    </g>

    <!-- Slogan / Descriptor -->
    <text x="540" y="325" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="8">
      VENTURE HOLDING · SOLUCIONES ECOSISTÉMICAS
    </text>
  </g>
</svg>
