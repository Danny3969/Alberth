<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="jayajGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8EFD4"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7810"/>
    </linearGradient>
    <linearGradient id="jayajPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Obsidian -->
  <rect width="1000" height="650" fill="#0A0D14" rx="20"/>

  <!-- Subtle Blueprint Precision Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="500" y1="40" x2="500" y2="610" stroke-dasharray="4 4"/>
    <line x1="100" y1="210" x2="900" y2="210" stroke-dasharray="4 4"/>
    <line x1="100" y1="420" x2="900" y2="420" stroke-dasharray="4 4"/>
    <circle cx="500" cy="210" r="160" fill="none"/>
    <circle cx="500" cy="210" r="110" fill="none"/>
    <circle cx="500" cy="210" r="60" fill="none"/>
  </g>

  <!-- ISOTIPO: Monograma Simétrico JYJ con Y Unificada Continua -->
  <g transform="translate(500, 210)">
    <!-- Aura de iluminación central -->
    <circle cx="0" cy="0" r="95" fill="url(#glowEffect)"/>

    <!-- Vector Central Y: Trazo único continuo monolítico -->
    <path d="M -50,-100 L -9,-21 L -9,58 L 9,58 L 9,-21 L 50,-100 L 30,-100 L 0,-42 L -30,-100 Z" fill="url(#jayajGold)"/>

    <!-- J Izquierda (Pilar y Ala Protectora - Espejo) -->
    <path d="M -34,-75 L -17,-75 L -17,22 C -17,49 -41,58 -66,58 C -85,58 -100,42 -100,22 L -82,22 C -82,32 -75,40 -66,40 C -46,40 -34,32 -34,22 Z" fill="url(#jayajPlatinum)"/>
    <rect x="-100" y="-75" width="83" height="12" rx="3" fill="url(#jayajPlatinum)"/>

    <!-- J Derecha (Pilar y Ala Protectora - Directa) -->
    <path d="M 34,-75 L 17,-75 L 17,22 C 17,49 41,58 66,58 C 85,58 100,42 100,22 L 82,22 C 82,32 75,40 66,40 C 46,40 34,32 34,22 Z" fill="url(#jayajPlatinum)"/>
    <rect x="17" y="-75" width="83" height="12" rx="3" fill="url(#jayajPlatinum)"/>
  </g>

  <!-- LOGOTIPO: J A Y A Ⴑ (Simetría Especular con J en Espejo) -->
  <g transform="translate(500, 445)">
    <!-- J Inicial -->
    <g transform="translate(-250, 0)">
      <path d="M 23,-49 L 46,-49 L 46,18 C 46,39 27,49 4,49 C -18,49 -36,37 -36,20 L -16,20 C -16,27 -9,32 4,32 C 18,32 23,25 23,18 Z" fill="url(#jayajPlatinum)"/>
      <rect x="-36" y="-49" width="82" height="13" rx="2" fill="url(#jayajPlatinum)"/>
    </g>
    <!-- A Izquierda -->
    <g transform="translate(-125, 0)">
      <path d="M -43,49 L -4,-49 L 14,-49 L 54,49 L 32,49 L 23,24 L -23,24 L -32,49 Z M -16,9 L 16,9 L 0,-31 Z" fill="url(#jayajPlatinum)"/>
    </g>
    <!-- Y Central -->
    <g transform="translate(0, 0)">
      <path d="M -32,-49 L 0,-4 L 32,-49 L 54,-49 L 12,11 L 12,49 L -12,49 L -12,11 L -54,-49 Z" fill="url(#jayajGold)"/>
    </g>
    <!-- A Derecha -->
    <g transform="translate(125, 0)">
      <path d="M -43,49 L -4,-49 L 14,-49 L 54,49 L 32,49 L 23,24 L -23,24 L -32,49 Z M -16,9 L 16,9 L 0,-31 Z" fill="url(#jayajPlatinum)"/>
    </g>
    <!-- J Final Reflejada -->
    <g transform="translate(250, 0) scale(-1, 1)">
      <path d="M 23,-49 L 46,-49 L 46,18 C 46,39 27,49 4,49 C -18,49 -36,37 -36,20 L -16,20 C -16,27 -9,32 4,32 C 18,32 23,25 23,18 Z" fill="url(#jayajPlatinum)"/>
      <rect x="-36" y="-49" width="82" height="13" rx="2" fill="url(#jayajPlatinum)"/>
    </g>
  </g>

  <!-- DESCRIPTOR DE HOLDING -->
  <text x="500" y="520" 
        text-anchor="middle" 
        font-family="'JetBrains Mono', 'SF Pro Text', monospace" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="14" 
        fill="url(#jayajGold)">
    VENTURE HOLDING
  </text>

  <!-- Detalles de ingeniería y endoso de marca -->
  <g opacity="0.4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">
    <text x="80" y="605">EST. 2026 · LATAM ↔ GLOBAL</text>
    <text x="500" y="605" text-anchor="middle">BILATERAL PALINDROMIC SYMMETRY</text>
    <text x="920" y="605" text-anchor="end">GOLDEN RATIO 1:1.618</text>
  </g>

  <!-- Línea base de horizonte -->
  <line x1="320" y1="545" x2="680" y2="545" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
</svg>
