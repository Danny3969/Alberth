<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="jayajGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8EFD4"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7810"/>
    </linearGradient>
    <linearGradient id="jayajPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Obsidian -->
  <rect width="1000" height="650" fill="#0A0D14" rx="20"/>

  <!-- Subtle Blueprint Precision Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="500" y1="40" x2="500" y2="610" stroke-dasharray="4 4"/>
    <line x1="100" y1="210" x2="900" y2="210" stroke-dasharray="4 4"/>
    <line x1="100" y1="420" x2="900" y2="420" stroke-dasharray="4 4"/>
    <circle cx="500" cy="210" r="160" fill="none"/>
    <circle cx="500" cy="210" r="110" fill="none"/>
    <circle cx="500" cy="210" r="60" fill="none"/>
  </g>

  <!-- ISOTIPO V2-A: EL PRISMA AXIAL (THE APEX PRISM) -->
  <g transform="translate(500, 210) scale(1.15)">
    <!-- Aura de iluminación central -->
    <circle cx="0" cy="0" r="95" fill="url(#glowEffect)"/>

    <!-- Vector Central Y: Aguja Ascendente de Inversión y Expansión -->
    <path d="M 0,-30 L -36,-105 L -16,-105 L 0,-62 Z" fill="url(#jayajGold)"/>
    <path d="M 0,-30 L 36,-105 L 16,-105 L 0,-62 Z" fill="url(#jayajGold)"/>
    <path d="M -7,-24 L 7,-24 L 7,65 L 0,80 L -7,65 Z" fill="url(#jayajGold)"/>

    <!-- J Izquierda (Vector de Impulso - Espejo) -->
    <path d="M -48,-85 L -30,-85 L -30,20 C -30,52 -52,70 -84,70 C -112,70 -128,52 -128,26 L -110,26 C -110,38 -100,52 -84,52 C -65,52 -48,40 -48,20 Z" fill="url(#jayajPlatinum)"/>
    <polygon points="-48,-85 -30,-85 -40,-102 -58,-102" fill="url(#jayajPlatinum)"/>

    <!-- Ⴑ Derecha (Vector Protector - Simetría Especular) -->
    <path d="M 48,-85 L 30,-85 L 30,20 C 30,52 52,70 84,70 C 112,70 128,52 128,26 L 110,26 C 110,38 100,52 84,52 C 65,52 48,40 48,20 Z" fill="url(#jayajPlatinum)"/>
    <polygon points="48,-85 30,-85 40,-102 58,-102" fill="url(#jayajPlatinum)"/>
  </g>

  <!-- LOGOTIPO V2: J A Y A Ⴑ (Sans Bespoke sin remate superior en J) -->
  <g transform="translate(500, 445) scale(0.72)">
    <!-- J Inicial -->
    <path d="M -290,-55 L -272,-55 L -272,15 C -272,38 -290,52 -315,52 C -340,52 -355,38 -355,18 L -337,18 C -337,28 -328,36 -315,36 C -300,36 -290,28 -290,15 Z" fill="url(#jayajPlatinum)"/>
    <!-- A Primera -->
    <path d="M -160,-55 L -140,-55 L -105,52 L -125,52 L -134,22 L -186,22 L -195,52 L -215,52 Z M -160,-15 L -178,8 L -142,8 Z" fill="url(#jayajPlatinum)"/>
    <!-- Y Central -->
    <path d="M -48,-55 L -10,12 L -10,52 L 10,52 L 10,12 L 48,-55 L 28,-55 L 0,-12 L -28,-55 Z" fill="url(#jayajGold)"/>
    <!-- A Segunda -->
    <path d="M 160,-55 L 180,-55 L 215,52 L 195,52 L 186,22 L 134,22 L 125,52 L 105,52 Z M 160,-15 L 142,8 L 178,8 Z" fill="url(#jayajPlatinum)"/>
    <!-- Ⴑ Final Espejo -->
    <path d="M 290,-55 L 272,-55 L 272,15 C 272,38 290,52 315,52 C 340,52 355,38 355,18 L 337,18 C 337,28 328,36 315,36 C 300,36 290,28 290,15 Z" fill="url(#jayajPlatinum)"/>
  </g>

  <!-- DESCRIPTOR DE HOLDING -->
  <text x="500" y="520" 
        text-anchor="middle" 
        font-family="'JetBrains Mono', 'SF Pro Text', monospace" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="14" 
        fill="url(#jayajGold)">
    VENTURE HOLDING
  </text>

  <!-- Detalles de ingeniería y endoso de marca -->
  <g opacity="0.4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">
    <text x="80" y="605">EST. 2026 · LATAM ↔ GLOBAL</text>
    <text x="500" y="605" text-anchor="middle">BILATERAL PALINDROMIC SYMMETRY</text>
    <text x="920" y="605" text-anchor="end">GOLDEN RATIO 1:1.618</text>
  </g>

  <!-- Línea base de horizonte -->
  <line x1="320" y1="545" x2="680" y2="545" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
</svg>
