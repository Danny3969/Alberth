<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 230" width="100%" height="100%">
  <defs>
    <!-- Oro Champaña Imperial -->
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#805F0D"/>
    </linearGradient>

    <!-- Platino Titanio -->
    <linearGradient id="hPlat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#8899A6"/>
    </linearGradient>
  </defs>

  <rect width="1050" height="230" fill="#07090E" rx="20"/>

  <!-- ==================== ISOTIPO V3 IZQUIERDA ==================== -->
  <g transform="translate(145, 115) scale(0.68)">
    <!-- Crisol / Antorcha Central (Y) -->
    <path d="M 0,-50 L -46,-135 L -22,-135 L 0,-92 L 22,-135 L 46,-135 Z" fill="url(#hGold)"/>
    <polygon points="0,-82 -18,-45 0,-15 18,-45" fill="url(#hGold)"/>
    <path d="M -9,-10 L 9,-10 L 9,95 L 0,115 L -9,95 Z" fill="url(#hGold)"/>

    <!-- Guardián Izquierdo (J Espejo) -->
    <path d="M -56,-115 L -34,-115 L -34,25 C -34,68 -65,95 -112,95 C -150,95 -172,70 -172,36 L -148,36 C -148,54 -134,72 -112,72 C -80,72 -56,52 -56,25 Z" fill="url(#hPlat)"/>
    <polygon points="-56,-115 -34,-115 -48,-138 -70,-138" fill="url(#hPlat)"/>

    <!-- Guardián Derecho (Ⴑ Directa) -->
    <path d="M 56,-115 L 34,-115 L 34,25 C 34,68 65,95 112,95 C 150,95 172,70 172,36 L 148,36 C 148,54 134,72 112,72 C 80,72 56,52 56,25 Z" fill="url(#hPlat)"/>
    <polygon points="56,-115 34,-115 48,-138 70,-138" fill="url(#hPlat)"/>

    <circle cx="0" cy="-152" r="3.5" fill="#D4AF37"/>
    <circle cx="0" cy="132" r="3.5" fill="#E2E8F0"/>
  </g>

  <!-- LÍNEA SEPARADORA DE PRECISIÓN VERTICAL -->
  <line x1="280" y1="35" x2="280" y2="195" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ==================== LOGOTIPO BESPOKE DERECHA ==================== -->
  <g transform="translate(660, 95) scale(0.68)">
    <!-- J Inicial -->
    <g transform="translate(-330, 0)">
      <path d="M 32,-55 L 50,-55 L 50,15 C 50,42 30,58 2,58 C -26,58 -44,42 -44,18 L -24,18 C -24,28 -14,38 2,38 C 20,38 30,28 30,15 Z" fill="url(#hPlat)"/>
      <polygon points="32,-55 50,-55 38,-70 20,-70" fill="url(#hPlat)"/>
    </g>
    <!-- A Primera -->
    <g transform="translate(-165, 0)">
      <path d="M 0,-70 L 22,-70 L 60,58 L 38,58 L 27,20 L -27,20 L -38,58 L -60,58 Z M 0,-24 L -19,4 L 19,4 Z" fill="url(#hPlat)"/>
    </g>
    <!-- Y Central -->
    <g transform="translate(0, 0)">
      <path d="M -54,-70 L -12,8 L -12,58 L 12,58 L 12,8 L 54,-70 L 32,-70 L 0,-18 L -32,-70 Z" fill="url(#hGold)"/>
      <polygon points="0,-32 -8,-18 0,-4 8,-18" fill="url(#hGold)"/>
    </g>
    <!-- A Segunda -->
    <g transform="translate(165, 0)">
      <path d="M 0,-70 L 22,-70 L 60,58 L 38,58 L 27,20 L -27,20 L -38,58 L -60,58 Z M 0,-24 L -19,4 L 19,4 Z" fill="url(#hPlat)"/>
    </g>
    <!-- Ⴑ Final Espejo -->
    <g transform="translate(330, 0) scale(-1, 1)">
      <path d="M 32,-55 L 50,-55 L 50,15 C 50,42 30,58 2,58 C -26,58 -44,42 -44,18 L -24,18 C -24,28 -14,38 2,38 C 20,38 30,28 30,15 Z" fill="url(#hPlat)"/>
      <polygon points="32,-55 50,-55 38,-70 20,-70" fill="url(#hPlat)"/>
    </g>
  </g>

  <!-- LÍNEA GUÍA DERECHA Y SUBTÍTULO -->
  <line x1="330" y1="155" x2="990" y2="155" stroke="#1E293B" stroke-width="1"/>
  <circle cx="660" cy="155" r="2.5" fill="#D4AF37"/>

  <text x="660" y="182" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="9">VENTURE HOLDING · INNOVATION ECOSYSTEM</text>
  <text x="660" y="204" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="14" fill="#D4AF37" letter-spacing="3">The Architecture of Next</text>
</svg>
