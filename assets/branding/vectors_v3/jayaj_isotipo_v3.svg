<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Oro Champaña Imperial -->
    <linearGradient id="goldV3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#805F0D"/>
    </linearGradient>

    <!-- Titanio Platino Aeroespacial -->
    <linearGradient id="platV3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#8899A6"/>
    </linearGradient>

    <!-- Resplandor de Presencia y Autoridad -->
    <radialGradient id="auraCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" fill="#07090E" rx="32"/>

  <!-- Aura de Energía Central -->
  <circle cx="250" cy="245" r="160" fill="url(#auraCenter)"/>

  <!-- ========================================================
       ISOTIPO JAYAJ V3: "EL TÓTEM DE LA VICTORIA"
       - Semántica: JAYAJ ("El Victorioso" en sánscrito)
       - Componentes:
         1. El Crisol Central (Y): Copa / Antorcha de la Innovación en Oro
         2. Las Alas Guardianas (J y Ⴑ): Fustes de acero curvado en espejo
       - Cero ambigüedad Gestalt, Cero letra M, Carácter monumental
       ======================================================== -->
  <g transform="translate(250, 245)">
    <!-- 1. CRISOL / ANTORCHA CENTRAL (Y MONOLÍTICA FACETADA) -->
    <!-- Copa de la Victoria (Cáliz Superior) -->
    <path d="M 0,-50 L -46,-135 L -22,-135 L 0,-92 L 22,-135 L 46,-135 Z" fill="url(#goldV3)"/>
    <!-- Prisma Central Núcleo -->
    <polygon points="0,-82 -18,-45 0,-15 18,-45" fill="url(#goldV3)"/>
    <!-- Fuste / Vástago Inferior de Anclaje -->
    <path d="M -9,-10 L 9,-10 L 9,95 L 0,115 L -9,95 Z" fill="url(#goldV3)"/>

    <!-- 2. GUARDIÁN IZQUIERDO: JTA DINÁMICA DE VANGUARDIA (ESPEJO) -->
    <!-- Hoja principal con curva cóncava de aceleración -->
    <path d="M -56,-115 L -34,-115 L -34,25 C -34,68 -65,95 -112,95 C -150,95 -172,70 -172,36 L -148,36 C -148,54 -134,72 -112,72 C -80,72 -56,52 -56,25 Z" fill="url(#platV3)"/>
    <!-- Ápice aerodinámico biselado a 45 grados -->
    <polygon points="-56,-115 -34,-115 -48,-138 -70,-138" fill="url(#platV3)"/>

    <!-- 3. GUARDIÁN DERECHO: ႱTA DE PRECISIÓN ESPECULAR -->
    <!-- Hoja principal simétrica -->
    <path d="M 56,-115 L 34,-115 L 34,25 C 34,68 65,95 112,95 C 150,95 172,70 172,36 L 148,36 C 148,54 134,72 112,72 C 80,72 56,52 56,25 Z" fill="url(#platV3)"/>
    <!-- Ápice aerodinámico biselado a 45 grados -->
    <polygon points="56,-115 34,-115 48,-138 70,-138" fill="url(#platV3)"/>

    <!-- 4. PUNTOS CARDINALES DE COORDENADAS (RIGOR HOLDING) -->
    <circle cx="0" cy="-152" r="3.5" fill="#D4AF37"/>
    <circle cx="0" cy="132" r="3.5" fill="#E2E8F0"/>
  </g>
</svg>
