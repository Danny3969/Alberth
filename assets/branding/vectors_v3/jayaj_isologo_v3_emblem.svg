<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Oro Champaña Imperial -->
    <linearGradient id="isoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#805F0D"/>
    </linearGradient>

    <!-- Titanio Platino -->
    <linearGradient id="isoPlatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Resplandor Central -->
    <radialGradient id="isoAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo Obsidiana -->
  <rect width="600" height="680" fill="#07090E" rx="32"/>

  <!-- ========================================================
       ISOLOGO OFICIAL JAYAJ V3: "EL EMBLEMA SOBERANO"
       - Definición: Símbolo y Texto fusionados en un escudo
         arquitectónico indivisible (no funcionan separados).
       - Aplicación: Sellos de inversión, hardware de lujo,
         títulos accionariales, lacrado digital de filiales.
       ======================================================== -->
  <g transform="translate(300, 340)">
    <!-- Aura de Fondo -->
    <circle cx="0" cy="-30" r="220" fill="url(#isoAura)"/>

    <!-- ESCUDO EXTERIOR BISELADO (Octógono Alargado de Precisión) -->
    <polygon points="0,-290 220,-290 260,-250 260,250 220,290 -220,290 -260,250 -260,-250 -220,-290" 
             fill="#0B0F19" 
             stroke="#1E293B" 
             stroke-width="2"/>

    <!-- Malla de Borde Interior en Oro Cepillado -->
    <polygon points="0,-278 212,-278 248,-242 248,242 212,278 -212,278 -248,242 -248,-242 -212,-278" 
             fill="none" 
             stroke="url(#isoGoldGrad)" 
             stroke-width="1.5" 
             stroke-opacity="0.6"/>

    <!-- Encabezado Superior del Sello -->
    <text x="0" y="-245" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#D4AF37" letter-spacing="6">EST. 2026 · VENTURE HOLDING</text>
    <line x1="-160" y1="-230" x2="160" y2="-230" stroke="#1E293B" stroke-width="1"/>

    <!-- ==========================================
         EL TÓTEM DE LA VICTORIA (ISOTIPO INTEGRADO)
         ========================================== -->
    <g transform="translate(0, -90) scale(0.92)">
      <!-- 1. Crisol / Antorcha Central (Y) -->
      <path d="M 0,-45 L -42,-125 L -20,-125 L 0,-85 L 20,-125 L 42,-125 Z" fill="url(#isoGoldGrad)"/>
      <polygon points="0,-75 -16,-40 0,-12 16,-40" fill="url(#isoGoldGrad)"/>
      <path d="M -8,-8 L 8,-8 L 8,90 L 0,108 L -8,90 Z" fill="url(#isoGoldGrad)"/>

      <!-- 2. Guardián Izquierdo (J Espejo) -->
      <path d="M -52,-105 L -32,-105 L -32,25 C -32,65 -60,90 -105,90 C -140,90 -160,68 -160,35 L -138,35 C -138,50 -125,68 -105,68 C -75,68 -52,50 -52,25 Z" fill="url(#isoPlatGrad)"/>
      <polygon points="-52,-105 -32,-105 -44,-126 -64,-126" fill="url(#isoPlatGrad)"/>

      <!-- 3. Guardián Derecho (Ⴑ Directa) -->
      <path d="M 52,-105 L 32,-105 L 32,25 C 32,65 60,90 105,90 C 140,90 160,68 160,35 L 138,35 C 138,50 125,68 105,68 C 75,68 52,50 52,25 Z" fill="url(#isoPlatGrad)"/>
      <polygon points="52,-105 32,-105 44,-126 64,-126" fill="url(#isoPlatGrad)"/>

      <circle cx="0" cy="-140" r="3" fill="#D4AF37"/>
    </g>

    <!-- ==========================================
         BANDA TIPOGRÁFICA PRINCIPAL (JAYAJ INTEGRADA)
         ========================================== -->
    <g transform="translate(0, 95) scale(0.60)">
      <!-- J Inicial -->
      <g transform="translate(-290, 0)">
        <path d="M 30,-50 L 48,-50 L 48,15 C 48,40 28,55 2,55 C -24,55 -40,40 -40,18 L -22,18 C -22,26 -12,36 2,36 C 18,36 28,26 28,15 Z" fill="url(#isoPlatGrad)"/>
        <polygon points="30,-50 48,-50 36,-65 18,-65" fill="url(#isoPlatGrad)"/>
      </g>
      <!-- A Primera -->
      <g transform="translate(-145, 0)">
        <path d="M 0,-65 L 20,-65 L 55,55 L 35,55 L 25,18 L -25,18 L -35,55 L -55,55 Z M 0,-22 L -18,4 L 18,4 Z" fill="url(#isoPlatGrad)"/>
      </g>
      <!-- Y Central -->
      <g transform="translate(0, 0)">
        <path d="M -50,-65 L -10,8 L -10,55 L 10,55 L 10,8 L 50,-65 L 30,-65 L 0,-16 L -30,-65 Z" fill="url(#isoGoldGrad)"/>
      </g>
      <!-- A Segunda -->
      <g transform="translate(145, 0)">
        <path d="M 0,-65 L 20,-65 L 55,55 L 35,55 L 25,18 L -25,18 L -35,55 L -55,55 Z M 0,-22 L -18,4 L 18,4 Z" fill="url(#isoPlatGrad)"/>
      </g>
      <!-- Ⴑ Final Espejo -->
      <g transform="translate(290, 0) scale(-1, 1)">
        <path d="M 30,-50 L 48,-50 L 48,15 C 48,40 28,55 2,55 C -24,55 -40,40 -40,18 L -22,18 C -22,26 -12,36 2,36 C 18,36 28,26 28,15 Z" fill="url(#isoPlatGrad)"/>
        <polygon points="30,-50 48,-50 36,-65 18,-65" fill="url(#isoPlatGrad)"/>
      </g>
    </g>

    <!-- Divisores de Precisión -->
    <line x1="-180" y1="165" x2="180" y2="165" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="165" r="2.5" fill="#D4AF37"/>

    <!-- Descriptor Base del Isologo -->
    <text x="0" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="7">INNOVATION ECOSYSTEM</text>
    <text x="0" y="222" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="400" fill="#64748B" letter-spacing="4">5 SUBSIDIARIES · GLOBAL REACH</text>

    <!-- Lema de Pie en Escudo -->
    <text x="0" y="258" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="14" fill="#D4AF37" letter-spacing="2">The Architecture of Next</text>
  </g>
</svg>
