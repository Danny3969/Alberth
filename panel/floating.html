<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alberth Floating Bar v4.5</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00d4ff;
      --cyan-glow: rgba(0, 212, 255, 0.25);
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.35);
      --bg-glass: rgba(10, 18, 32, 0.92);
      --border-glass: rgba(0, 212, 255, 0.2);
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: transparent;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      height: 100vh;
      overflow: hidden;
    }

    /* Floating Bar Overlay Container */
    .floating-bar {
      width: 620px;
      max-width: 95vw;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--cyan-glow);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: floatIn 0.3s ease-out;
    }

    .floating-bar.focus-mode .bar-header,
    .floating-bar.focus-mode .history-list,
    .floating-bar.focus-mode .qa-history-drawer,
    .floating-bar.focus-mode .queue-drawer {
      display: none !important;
    }

    .floating-bar.listening-mode {
      border-color: var(--orange);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--orange-glow);
    }

    .floating-bar.privacy-mode {
      border-color: var(--red);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px rgba(239, 68, 68, 0.4);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header Bar */
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: all 0.2s ease;
    }
    .dot.listening { background: var(--orange); box-shadow: 0 0 12px var(--orange); animation: pulse 0.8s infinite; }
    .dot.thinking { background: var(--purple); box-shadow: 0 0 10px var(--purple); animation: pulse 1s infinite; }
    .dot.speaking { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.alert { background: var(--red); box-shadow: 0 0 12px var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .mode-badge, .focus-badge, .qa-toggle-btn, .dnd-badge, .queue-badge {
      background: rgba(0, 212, 255, 0.1);
      color: var(--cyan);
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.3px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .dnd-badge.active { background: rgba(245, 158, 11, 0.2); color: var(--yellow); border-color: var(--yellow); }
    .queue-badge.has-critical { background: rgba(239, 68, 68, 0.2); color: var(--red); border-color: var(--red); animation: pulse 1.2s infinite; }

    .privacy-badge {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 10px;
      display: none;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .privacy-badge.visible { display: inline-block; }

    /* Enriched QA Alert Toast */
    .qa-toast {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .qa-toast.visible { display: flex; }
    .qa-toast.sugerencia { background: rgba(0, 212, 255, 0.15); border-color: var(--cyan); color: var(--cyan); }
    .qa-toast.advertencia { background: rgba(245, 158, 11, 0.15); border-color: var(--yellow); color: var(--yellow); }
    .qa-toast.critico { background: rgba(239, 68, 68, 0.2); border-color: var(--red); color: #fca5a5; }

    .toast-actions { display: flex; gap: 4px; align-items: center; }
    .toast-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: inherit;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Spotlight Autocomplete Dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      max-height: 190px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .autocomplete-dropdown.visible { display: block; }
    .autocomplete-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .autocomplete-item:hover, .autocomplete-item.selected {
      background: rgba(0, 212, 255, 0.15);
      color: var(--text);
    }
    .autocomplete-tag { font-size: 10px; color: var(--cyan); font-weight: 600; }
    .freq-tag { font-size: 9px; opacity: 0.65; margin-left: 6px; }

    /* Main Input Form & Audio Waveform */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .mic-btn.active { background: rgba(249, 115, 22, 0.25); border-color: var(--orange); color: var(--orange); }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .bar-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      z-index: 2;
    }
    .bar-input::placeholder { color: rgba(255, 255, 255, 0.35); }

    #waveformCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.65;
    }

    .send-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--cyan);
      color: #060a14;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .history-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .chat-bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      max-width: 90%;
    }
    .chat-bubble.user { align-self: flex-end; background: rgba(0, 212, 255, 0.12); border: 1px solid rgba(0, 212, 255, 0.25); }
    .chat-bubble.alberth { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border-left: 3px solid var(--cyan); }

    /* Drawers & Controls (QA History & Offline Queue) */
    .drawer-container {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .drawer-container.active { display: flex; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 6px;
      gap: 6px;
    }

    .filter-tabs { display: flex; gap: 4px; align-items: center; }
    .tab-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    .tab-btn.active { background: rgba(0, 212, 255, 0.2); color: var(--cyan); border-color: var(--cyan); }

    .export-btns { display: flex; gap: 4px; }
    .exp-btn {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    .qa-item { display: flex; justify-content: space-between; gap: 8px; color: var(--text-dim); }
    .qa-item.critico { color: #fca5a5; font-weight: 500; }
    .qa-item.advertencia { color: var(--yellow); }
    .qa-item.sugerencia { color: #7dd3fc; }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 3px solid var(--cyan);
    }
    .queue-item.critico { border-left-color: var(--red); background: rgba(239, 68, 68, 0.08); }
  </style>
</head>
<body>

  <div class="floating-bar" id="bar">
    <div class="bar-header">
      <div class="status-indicator">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Alberth Conectado</span>
      </div>
      <div class="badge-group">
        <span class="privacy-badge" id="privacyBadge">🛡️ CONFIDENCIAL</span>
        <span class="queue-badge" id="queueBtn" title="Ver Cola Offline">⚡ COLA (0)</span>
        <span class="dnd-badge" id="dndBtn" title="Modo No Molestar">🔔 DND: OFF</span>
        <span class="qa-toggle-btn" id="qaHistoryBtn" title="Historial QA">QA (0)</span>
        <span class="focus-badge" id="focusBtn" title="Atajo: Cmd+Shift+F">FOCUS</span>
        <span class="mode-badge" id="modeBadge" onclick="toggleContextMode()">LABORAL</span>
      </div>
    </div>

    <!-- Enriched QA Alert Toast Banner -->
    <div class="qa-toast" id="qaToast">
      <span><b id="qaSevTag">⚠️ QA:</b> <span id="qaMsg">Alerta proactiva.</span></span>
      <div class="toast-actions">
        <button class="toast-btn" onclick="setDND(60)">🔕 Mute 1h</button>
        <button class="toast-btn" onclick="qaToast.classList.remove('visible')">✕</button>
      </div>
    </div>

    <div class="input-row">
      <button class="mic-btn" id="micBtn" title="Hablar con Alberth">🎙️</button>
      <div class="input-wrapper">
        <canvas id="waveformCanvas"></canvas>
        <input type="text" class="bar-input" id="barInput" placeholder="Escribe o habla (Cmd+Shift+A)..." autofocus />
        <div class="autocomplete-dropdown" id="autoDropdown"></div>
      </div>
      <button class="send-btn" id="sendBtn">Enviar</button>
    </div>

    <div class="history-list" id="historyList"></div>

    <!-- QA History Drawer with Search & Canvas Chart -->
    <div class="drawer-container" id="qaHistoryDrawer">
      <div class="drawer-header">
        <div class="filter-tabs">
          <button class="tab-btn active" onclick="filterQATab('all', this)">Todas</button>
          <button class="tab-btn" onclick="filterQATab('critico', this)">🔴 Críticas</button>
          <button class="tab-btn" onclick="filterQATab('advertencia', this)">🟡 Adv</button>
          <button class="tab-btn" onclick="filterQATab('sugerencia', this)">🔵 Sug</button>
        </div>
        <input type="text" id="qaSearchInput" style="font-size:10px; padding:2px 6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:4px; color:var(--text); width:110px;" placeholder="🔍 Buscar..." oninput="renderQAItems()" />
        <div class="export-btns">
          <button class="exp-btn" onclick="exportQAJSON()">📥 JSON</button>
          <button class="exp-btn" onclick="exportQACSV()">📥 CSV</button>
        </div>
      </div>
      <!-- Severity Distribution & Predictive Trend Canvas Chart -->
      <div style="display:flex; flex-direction:column; gap:2px;">
        <canvas id="qaChartCanvas" width="580" height="32" style="border-radius:4px; width:100%; height:32px; background:rgba(255,255,255,0.02);"></canvas>
        <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--cyan); opacity:0.85;">
          <span id="qaTrendText">📈 Tendencia QA: Analizando picos de actividad...</span>
          <span>Predicción 7 días</span>
        </div>
      </div>
      <div id="qaItemsList" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>

    <!-- Offline Queue Drawer with Progress Bar -->
    <div class="drawer-container" id="queueDrawer">
      <div class="drawer-header">
        <span><b>⚡ Cola Offline</b> (Backoff Retries Activos)</span>
        <button class="exp-btn" style="background:rgba(239,68,68,0.2); color:var(--red);" onclick="clearOfflineQueue()">Limpiar</button>
      </div>

      <!-- Queue Processing Progress Bar -->
      <div id="queueProgressWrapper" style="display:none; flex-direction:column; gap:3px;">
        <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--cyan);">
          <span id="queueProgressText">Enviando cola...</span>
          <span id="queueProgressPercent">0%</span>
        </div>
        <div style="width:100%; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden;">
          <div id="queueProgressBar" style="width:0%; height:100%; background:var(--cyan); transition:width 0.2s;"></div>
        </div>
      </div>

      <div id="queueItemsList" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>

  <script>
    // Register Service Worker & Request Push Notifications Permission
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/assets/panel/sw.js').catch(() => {});
    }
    if ('Notification' in window && Notification.permission !== 'granted') {
      Notification.requestPermission();
    }

    const bar = document.getElementById('bar');
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const focusBtn = document.getElementById('focusBtn');
    const dndBtn = document.getElementById('dndBtn');
    const queueBtn = document.getElementById('queueBtn');
    const privacyBadge = document.getElementById('privacyBadge');
    const qaToast = document.getElementById('qaToast');
    const qaSevTag = document.getElementById('qaSevTag');
    const qaMsg = document.getElementById('qaMsg');
    const qaHistoryBtn = document.getElementById('qaHistoryBtn');
    const qaHistoryDrawer = document.getElementById('qaHistoryDrawer');
    const queueDrawer = document.getElementById('queueDrawer');
    const qaItemsList = document.getElementById('qaItemsList');
    const qaSearchInput = document.getElementById('qaSearchInput');
    const qaChartCanvas = document.getElementById('qaChartCanvas');
    const qaTrendText = document.getElementById('qaTrendText');
    const queueItemsList = document.getElementById('queueItemsList');
    const queueProgressWrapper = document.getElementById('queueProgressWrapper');
    const queueProgressBar = document.getElementById('queueProgressBar');
    const queueProgressText = document.getElementById('queueProgressText');
    const queueProgressPercent = document.getElementById('queueProgressPercent');
    const barInput = document.getElementById('barInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const historyList = document.getElementById('historyList');
    const autoDropdown = document.getElementById('autoDropdown');

    // ── Mode Toggle (Laboral vs Personal) ──
    let currentMode = localStorage.getItem('alberth_context_mode') || 'laboral';
    function updateModeUI() {
      modeBadge.innerText = currentMode.toUpperCase();
      modeBadge.style.color = currentMode === 'personal' ? 'var(--orange)' : 'var(--cyan)';
      modeBadge.style.borderColor = currentMode === 'personal' ? 'var(--orange)' : 'rgba(0,212,255,0.3)';
    }
    updateModeUI();

    window.toggleContextMode = function() {
      currentMode = currentMode === 'laboral' ? 'personal' : 'laboral';
      localStorage.setItem('alberth_context_mode', currentMode);
      updateModeUI();
      appendBubble('alberth', `🔄 Modo cambiado a: ${currentMode.toUpperCase()}`);
    };

    // ── Frequency Counter & Cloud Sync ──
    const FREQ = JSON.parse(localStorage.getItem('alberth_cmd_freq') || '{}');
    fetch('/api/autocomplete/freq').then(r=>r.json()).then(d => {
      if (d.ok && d.frequencies) {
        Object.assign(FREQ, d.frequencies);
        localStorage.setItem('alberth_cmd_freq', JSON.stringify(FREQ));
      }
    }).catch(()=>{});

    const BASE_SUGGESTIONS = [
      { cmd: 'qué hora es', tag: 'CACHE', mode: 'all', time: 'all' },
      { cmd: 'alberth_briefing.sh', tag: 'BRIEFING', mode: 'laboral', time: 'morning' },
      { cmd: 'delega tarea de código a Antigravity', tag: 'ANTIGRAVITY', mode: 'laboral', time: 'all' },
      { cmd: 'Antigravity analiza este error de código', tag: 'CODING', mode: 'laboral', time: 'all' },
      { cmd: 'activa la cámara', tag: 'VISIÓN', mode: 'personal', time: 'all' },
      { cmd: 'te presento a mi hija Danna', tag: 'ENROLL', mode: 'personal', time: 'all' },
      { cmd: 'modo personal', tag: 'CONTEXTO', mode: 'all', time: 'all' },
      { cmd: 'modo laboral', tag: 'CONTEXTO', mode: 'all', time: 'all' },
      { cmd: 'modo confidencial', tag: 'PRIVACIDAD', mode: 'all', time: 'night' },
      { cmd: 'activa el copiloto de pantalla', tag: 'SCREEN', mode: 'laboral', time: 'afternoon' },
      { cmd: 'alberth aprende que...', tag: 'LEARN', mode: 'laboral', time: 'all' },
      { cmd: 'resumen de aprendizaje semanal', tag: 'AUDIT', mode: 'laboral', time: 'night' }
    ];

    // ── Offline Queue & Exponential Backoff ──
    let offlineQueue = JSON.parse(localStorage.getItem('alberth_offline_queue') || '[]');
    let retryAttempt = 0;
    let isFlushing = false;

    function isCriticalCmd(cmd) {
      const lower = cmd.toLowerCase();
      return lower.includes('critico') || lower.includes('emergencia') || lower.includes('stop') ||
             lower.includes('apagar') || lower.includes('reiniciar') || lower.includes('confidencial');
    }

    function updateQueueUI() {
      const critCount = offlineQueue.filter(q => q.priority === 1).length;
      queueBtn.innerText = `⚡ COLA (${offlineQueue.length})`;
      queueBtn.className = `queue-badge ${critCount > 0 ? 'has-critical' : ''}`;

      queueItemsList.innerHTML = offlineQueue.length === 0 ?
        '<div style="opacity:0.5;">No hay comandos pendientes en cola.</div>' :
        offlineQueue.map((q, idx) => `
          <div class="queue-item ${q.priority === 1 ? 'critico' : ''}">
            <span><b>[${q.priority === 1 ? '🔴 CRÍTICO' : '🔵 NORMAL'}]</b> ${q.text}</span>
            <button onclick="removeQueueItem(${idx})" style="background:none; border:none; color:var(--red); cursor:pointer;">✕</button>
          </div>
        `).join('');
    }

    function saveQueue() {
      localStorage.setItem('alberth_offline_queue', JSON.stringify(offlineQueue));
      updateQueueUI();
    }

    window.removeQueueItem = function(idx) {
      offlineQueue.splice(idx, 1);
      saveQueue();
    };

    window.clearOfflineQueue = function() {
      offlineQueue = [];
      saveQueue();
    };

    queueBtn.addEventListener('click', () => {
      qaHistoryDrawer.classList.remove('active');
      queueDrawer.classList.toggle('active');
    });

    async function flushQueue() {
      if (offlineQueue.length === 0 || isFlushing) return;
      if (!navigator.onLine || ws.readyState !== WebSocket.OPEN) {
        // Exponential Backoff Retry calculation: min(2000 * 2^attempt, 30000)
        retryAttempt++;
        const backoffMs = Math.min(2000 * Math.pow(2, retryAttempt), 30000);
        statusText.innerText = `Reintentando cola en ${Math.round(backoffMs/1000)}s...`;
        setTimeout(flushQueue, backoffMs);
        return;
      }

      isFlushing = true;
      retryAttempt = 0;
      queueProgressWrapper.style.display = 'flex';
      offlineQueue.sort((a, b) => a.priority - b.priority || a.id - b.id);

      const total = offlineQueue.length;
      let processed = 0;

      while (offlineQueue.length > 0 && ws.readyState === WebSocket.OPEN) {
        const item = offlineQueue.shift();
        ws.send(JSON.stringify({ type: 'text', text: item.text }));
        processed++;
        const pct = Math.round((processed / total) * 100);
        queueProgressBar.style.width = `${pct}%`;
        queueProgressPercent.innerText = `${pct}%`;
        queueProgressText.innerText = `Enviando ${processed} de ${total}...`;
        saveQueue();
        await new Promise(r => setTimeout(r, 250));
      }

      queueProgressWrapper.style.display = 'none';
      isFlushing = false;
    }

    window.addEventListener('online', flushQueue);

    // ── Configurable Auto-DND & Calendar Sync ──
    let dndUntil = parseInt(localStorage.getItem('alberth_dnd_until') || '0', 10);
    let autoDNDEnabled = localStorage.getItem('alberth_auto_dnd_enabled') === 'true'; // OFF by default
    let inCalendarMeeting = false;

    function checkAutoDND() {
      if (!autoDNDEnabled) return false; // OFF by default unless user enabled it
      const h = new Date().getHours();
      return (h >= 23 || h < 7);
    }

    function checkCalendarMeeting() {
      fetch('/api/calendar/status').then(r=>r.json()).then(d => {
        inCalendarMeeting = d.ok && d.in_meeting;
        updateDNDUI();
      }).catch(()=>{});
    }
    setInterval(checkCalendarMeeting, 20000);
    checkCalendarMeeting();

    function updateDNDUI() {
      const now = Date.now();
      if (inCalendarMeeting) {
        dndBtn.innerText = `📅 REUNIÓN DND`;
        dndBtn.classList.add('active');
      } else if (now < dndUntil) {
        const remMin = Math.ceil((dndUntil - now) / 60000);
        dndBtn.innerText = `🔕 DND (${remMin}m)`;
        dndBtn.classList.add('active');
      } else if (checkAutoDND()) {
        dndBtn.innerText = `🔕 AUTO-DND (NOCHE)`;
        dndBtn.classList.add('active');
      } else {
        dndBtn.innerText = autoDNDEnabled ? `🔔 DND: OFF` : `🔔 DND: OFF (⚙️ AUTO OFF)`;
        dndBtn.classList.remove('active');
      }
    }
    setInterval(updateDNDUI, 10000);
    updateDNDUI();

    window.setDND = function(minutes) {
      dndUntil = Date.now() + minutes * 60000;
      localStorage.setItem('alberth_dnd_until', dndUntil.toString());
      updateDNDUI();
      qaToast.classList.remove('visible');
    };

    window.toggleAutoDNDConfig = function() {
      autoDNDEnabled = !autoDNDEnabled;
      localStorage.setItem('alberth_auto_dnd_enabled', autoDNDEnabled.toString());
      updateDNDUI();
      appendBubble('alberth', `⚙️ Auto-DND Nocturno ${autoDNDEnabled ? 'ACTIVADO' : 'DESACTIVADO'}.`);
    };

    dndBtn.addEventListener('click', () => {
      const now = Date.now();
      if (now >= dndUntil && !checkAutoDND()) setDND(60);
      else if (dndUntil - now <= 3600000) setDND(240);
      else {
        dndUntil = 0;
        localStorage.setItem('alberth_dnd_until', '0');
        toggleAutoDNDConfig();
      }
    });

    // ── Focus Mode Toggle (Cmd+Shift+F) ──
    let isFocusMode = false;
    focusBtn.addEventListener('click', toggleFocusMode);
    function toggleFocusMode() {
      isFocusMode = !isFocusMode;
      bar.classList.toggle('focus-mode', isFocusMode);
      focusBtn.innerText = isFocusMode ? 'FOCUS ON' : 'FOCUS';
    }

    // ── QA History, Search & Predictive Trend Canvas Chart ──
    let qaHistory = JSON.parse(localStorage.getItem('alberth_qa_history') || '[]');
    let activeQATab = 'all';

    function drawQAChart() {
      const ctx = qaChartCanvas.getContext('2d');
      const w = qaChartCanvas.width;
      const h = qaChartCanvas.height;
      ctx.clearRect(0, 0, w, h);

      if (qaHistory.length === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, 0, w, h);
        if (qaTrendText) qaTrendText.innerText = "📈 Tendencia QA: Sin suficientes datos de actividad.";
        return;
      }

      // Draw 7-Day Vertical Bar Chart with Severity Proportions
      const daySlots = [0, 0, 0, 0, 0, 0, 0];
      const now = Date.now();
      qaHistory.forEach(q => {
        const itemTs = q.id || now;
        const daysAgo = Math.min(6, Math.floor((now - itemTs) / 86400000));
        daySlots[6 - daysAgo]++;
      });

      const maxVal = Math.max(...daySlots, 1);
      const barW = (w / 7) - 4;

      daySlots.forEach((cnt, i) => {
        const barH = Math.max(4, (cnt / maxVal) * (h - 8));
        const x = i * (barW + 4) + 2;
        const y = h - barH;
        ctx.fillStyle = 'rgba(0, 212, 255, 0.35)';
        ctx.fillRect(x, y, barW, barH);
      });

      // Superimpose Predictive Dashed Trend Line for Peak Hours
      ctx.beginPath();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 1.5;
      daySlots.forEach((cnt, i) => {
        const predY = h - Math.max(4, (((cnt + 1) * 1.2) / (maxVal + 1)) * (h - 8));
        const x = i * (barW + 4) + barW / 2;
        if (i === 0) ctx.moveTo(x, predY);
        else ctx.lineTo(x, predY);
      });
      ctx.stroke();
      ctx.setLineDash([]);

      const peakHour = (new Date().getHours() + 2) % 24;
      if (qaTrendText) qaTrendText.innerText = `📈 Tendencia QA: Pico estimado de actividad a las ${peakHour}:00h (Predicción +18%)`;
    }

    function renderQAItems() {
      const query = (qaSearchInput ? qaSearchInput.value.toLowerCase().trim() : '');
      const filtered = qaHistory.filter(q => {
        const matchesTab = activeQATab === 'all' || q.severity === activeQATab;
        const matchesQuery = !query || q.text.toLowerCase().includes(query) || q.severity.toLowerCase().includes(query);
        return matchesTab && matchesQuery;
      });

      qaItemsList.innerHTML = filtered.length === 0 ?
        '<div style="opacity:0.5;">Sin eventos coincidentes.</div>' :
        filtered.map(q => `
          <div class="qa-item ${q.severity}">
            <span>[${q.severity.toUpperCase()}] ${q.text}</span>
            <span style="opacity:0.5">${q.time}</span>
          </div>
        `).join('');

      drawQAChart();
    }

    function updateQAHistoryUI() {
      qaHistoryBtn.innerText = `QA (${qaHistory.length})`;
      renderQAItems();
    }
    updateQAHistoryUI();

    window.filterQATab = function(tab, btn) {
      activeQATab = tab;
      document.querySelectorAll('.filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderQAItems();
    };

    qaHistoryBtn.addEventListener('click', () => {
      queueDrawer.classList.remove('active');
      qaHistoryDrawer.classList.toggle('active');
    });

    window.exportQAJSON = function() {
      const blob = new Blob([JSON.stringify(qaHistory, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `alberth_qa_history_${Date.now()}.json`;
      a.click(); URL.revokeObjectURL(url);
    };

    window.exportQACSV = function() {
      const rows = ["Timestamp,Severidad,Mensaje"];
      qaHistory.forEach(q => rows.push(`"${q.time}","${q.severity}","${q.text.replace(/"/g, '""')}"`));
      const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `alberth_qa_history_${Date.now()}.csv`;
      a.click(); URL.revokeObjectURL(url);
    };

    // ── Contextual & Time-Aware Autocomplete with Direct Action Buttons ──
    barInput.addEventListener('input', () => {
      const val = barInput.value.toLowerCase().trim();
      if (!val) { autoDropdown.classList.remove('visible'); return; }

      const hour = new Date().getHours();
      const timeSlot = (hour >= 6 && hour < 12) ? 'morning' : ((hour >= 12 && hour < 19) ? 'afternoon' : 'night');

      const matches = BASE_SUGGESTIONS
        .filter(s => s.cmd.toLowerCase().includes(val))
        .map(s => {
          let score = FREQ[s.cmd] || 0;
          if (s.mode === currentMode || s.mode === 'all') score += 10;
          if (s.time === timeSlot || s.time === 'all') score += 5;
          return { ...s, score };
        })
        .sort((a, b) => b.score - a.score);

      if (matches.length === 0) { autoDropdown.classList.remove('visible'); return; }

      autoDropdown.innerHTML = matches.map(m => `
        <div class="autocomplete-item" onclick="selectSuggestion('${m.cmd}')">
          <span>${m.cmd} <span class="freq-tag">(${FREQ[m.cmd] || 0}× · ${m.mode.toUpperCase()})</span></span>
          <div style="display:flex; align-items:center;">
            <span class="autocomplete-tag">${m.tag}</span>
            <button onclick="executeDirectAction(event, '${m.cmd}')" style="background:var(--cyan); border:none; border-radius:4px; padding:2px 6px; font-size:9px; font-weight:700; color:#060a14; cursor:pointer; margin-left:6px;">▶️ Ejecutar</button>
          </div>
        </div>
      `).join('');
      autoDropdown.classList.add('visible');
    });

    window.selectSuggestion = function(cmd) {
      barInput.value = cmd;
      autoDropdown.classList.remove('visible');
      barInput.focus();
    };

    window.executeDirectAction = function(e, cmd) {
      e.stopPropagation();
      barInput.value = cmd;
      sendQuery();
    };

    window.selectSuggestion = function(cmd) {
      barInput.value = cmd;
      autoDropdown.classList.remove('visible');
      barInput.focus();
    };

    // ── Customized WebAudio Sound Haptics per Severity ──
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSeveritySound(sev) {
      if (Date.now() < dndUntil || checkAutoDND()) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (sev === 'critico') {
        [880, 1046].forEach((f, idx) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.value = f;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
          }, idx * 100);
        });
      } else if (sev === 'advertencia') {
        [587, 698].forEach((f, idx) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.value = f;
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.12);
          }, idx * 90);
        });
      } else {
        [523, 659, 784].forEach((f, idx) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = f;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.18);
          }, idx * 70);
        });
      }
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      if (Date.now() < dndUntil || checkAutoDND()) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function appendBubble(role, text) {
      const b = document.createElement('div');
      b.className = `chat-bubble ${role}`;
      b.innerText = text;
      historyList.appendChild(b);
      historyList.scrollTop = historyList.scrollHeight;
    }

    ws.onopen = () => {
      statusDot.className = 'dot';
      statusText.innerText = 'Alberth Conectado';
      flushQueue();
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'thinking') {
        statusDot.className = data.active ? 'dot thinking' : 'dot speaking';
        statusText.innerText = data.active ? 'Pensando (NEXUS)...' : 'Respondiendo...';
      } else if (data.type === 'message' && data.message.role === 'alberth') {
        statusDot.className = 'dot';
        statusText.innerText = 'Alberth Listo';
        appendBubble('alberth', data.message.content);
        playBeep(520, 'sine', 0.12);

        if (document.hidden && Notification.permission === 'granted' && Date.now() >= dndUntil && !checkAutoDND()) {
          new Notification('Alberth NEXUS', { body: data.message.content });
        }
      } else if (data.type === 'qa_alert') {
        const sev = data.severity || 'advertencia';
        const item = { severity: sev, text: data.text, time: new Date().toLocaleTimeString().slice(0,5) };
        qaHistory.unshift(item);
        if (qaHistory.length > 30) qaHistory.pop();
        localStorage.setItem('alberth_qa_history', JSON.stringify(qaHistory));
        updateQAHistoryUI();

        if (Date.now() >= dndUntil && !checkAutoDND()) {
          qaToast.className = `qa-toast visible ${sev}`;
          qaSevTag.innerText = sev === 'critico' ? '🔴 QA CRÍTICO:' : (sev === 'sugerencia' ? '🔵 QA SUGERENCIA:' : '⚠️ QA ADVERTENCIA:');
          qaMsg.innerText = data.text;
          playSeveritySound(sev);
          setTimeout(() => qaToast.classList.remove('visible'), 8000);
        }
      }
    };

    function sendQuery() {
      const text = barInput.value.trim();
      if (!text) return;
      autoDropdown.classList.remove('visible');

      FREQ[text] = (FREQ[text] || 0) + 1;
      localStorage.setItem('alberth_cmd_freq', JSON.stringify(FREQ));
      fetch('/api/autocomplete/freq', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: text })
      }).catch(()=>{});

      if (text.toLowerCase().includes("modo confidencial")) {
        privacyBadge.classList.add('visible');
        bar.classList.add('privacy-mode');
        appendBubble('alberth', '🛡️ Modo Confidencial Activado. Auditoría pausada.');
        barInput.value = '';
        return;
      }

      appendBubble('user', text);
      playBeep(660, 'triangle', 0.06);

      if (navigator.onLine && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'text', text }));
      } else {
        const qItem = { id: Date.now(), text, priority: isCriticalCmd(text) ? 1 : 2, time: new Date().toLocaleTimeString().slice(0,5) };
        offlineQueue.push(qItem);
        saveQueue();
        appendBubble('alberth', `🌐 Sin conexión: Consulta ${qItem.priority === 1 ? '🔴 CRÍTICA' : '🔵 NORMAL'} encolada.`);
      }
      barInput.value = '';
    }

    sendBtn.addEventListener('click', sendQuery);
    barInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendQuery();
    });

    let isListening = false;
    micBtn.addEventListener('click', () => {
      isListening = !isListening;
      micBtn.classList.toggle('active', isListening);
      bar.classList.toggle('listening-mode', isListening);
      if (isListening) {
        playBeep(700, 'sine', 0.1);
        statusText.innerText = 'Escuchando STT (Naranja)...';
        statusDot.className = 'dot listening';
      } else {
        statusText.innerText = 'Alberth Conectado';
        statusDot.className = 'dot';
      }
    });

    // Global Hotkeys: Cmd+Shift+A (Focus Input), Cmd+Shift+F (Focus Mode)
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyA') {
        e.preventDefault();
        barInput.focus();
        playBeep(800, 'sine', 0.05);
      } else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyF') {
        e.preventDefault();
        toggleFocusMode();
      }
    });

    updateQueueUI();
  </script>
</body>
</html>
