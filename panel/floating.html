<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alberth Floating Bar v4.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00d4ff;
      --cyan-glow: rgba(0, 212, 255, 0.25);
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.35);
      --bg-glass: rgba(10, 18, 32, 0.92);
      --border-glass: rgba(0, 212, 255, 0.2);
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: transparent;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      height: 100vh;
      overflow: hidden;
    }

    /* Floating Bar Overlay Container */
    .floating-bar {
      width: 580px;
      max-width: 95vw;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--cyan-glow);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: floatIn 0.3s ease-out;
    }

    .floating-bar.focus-mode .bar-header,
    .floating-bar.focus-mode .history-list,
    .floating-bar.focus-mode .qa-history-drawer {
      display: none !important;
    }

    .floating-bar.listening-mode {
      border-color: var(--orange);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--orange-glow);
    }

    .floating-bar.privacy-mode {
      border-color: var(--red);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px rgba(239, 68, 68, 0.4);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header Bar */
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: all 0.2s ease;
    }
    .dot.listening { background: var(--orange); box-shadow: 0 0 12px var(--orange); animation: pulse 0.8s infinite; }
    .dot.thinking { background: var(--purple); box-shadow: 0 0 10px var(--purple); animation: pulse 1s infinite; }
    .dot.speaking { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.alert { background: var(--red); box-shadow: 0 0 12px var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-badge, .focus-badge {
      background: rgba(0, 212, 255, 0.1);
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      cursor: pointer;
    }

    .privacy-badge {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 10px;
      display: none;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .privacy-badge.visible { display: inline-block; }

    /* QA Alert Toast & Severity Levels */
    .qa-toast {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .qa-toast.visible { display: flex; }
    .qa-toast.sugerencia { background: rgba(0, 212, 255, 0.15); border-color: var(--cyan); color: var(--cyan); }
    .qa-toast.advertencia { background: rgba(245, 158, 11, 0.15); border-color: var(--yellow); color: var(--yellow); }
    .qa-toast.critico { background: rgba(239, 68, 68, 0.2); border-color: var(--red); color: #fca5a5; }

    /* Spotlight Autocomplete Dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      max-height: 160px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .autocomplete-dropdown.visible { display: block; }
    .autocomplete-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      justify-content: space-between;
    }
    .autocomplete-item:hover, .autocomplete-item.selected {
      background: rgba(0, 212, 255, 0.15);
      color: var(--text);
    }
    .autocomplete-tag {
      font-size: 10px;
      color: var(--cyan);
      font-weight: 600;
    }

    /* Main Input Form & Audio Waveform */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .mic-btn.active { background: rgba(249, 115, 22, 0.25); border-color: var(--orange); color: var(--orange); }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .bar-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      z-index: 2;
    }
    .bar-input::placeholder { color: rgba(255, 255, 255, 0.35); }

    #waveformCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.65;
    }

    .send-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--cyan);
      color: #060a14;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .history-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .chat-bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      max-width: 90%;
    }
    .chat-bubble.user { align-self: flex-end; background: rgba(0, 212, 255, 0.12); border: 1px solid rgba(0, 212, 255, 0.25); }
    .chat-bubble.alberth { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border-left: 3px solid var(--cyan); }

    /* QA Alert History Drawer (Last 10 Events) */
    .qa-history-drawer {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }
    .qa-history-drawer.active { display: flex; }
    .qa-item { display: flex; justify-content: space-between; color: var(--text-dim); }
  </style>
</head>
<body>

  <div class="floating-bar" id="bar">
    <div class="bar-header">
      <div class="status-indicator">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Alberth Conectado</span>
      </div>
      <div class="badge-group">
        <span class="privacy-badge" id="privacyBadge">🛡️ CONFIDENCIAL</span>
        <span class="focus-badge" id="focusBtn" title="Atajo: Cmd+Shift+F">FOCUS</span>
        <span class="mode-badge" id="modeBadge">LABORAL</span>
      </div>
    </div>

    <!-- QA Alert Toast Banner -->
    <div class="qa-toast" id="qaToast">
      <span><b id="qaSevTag">⚠️ Agente QA:</b> <span id="qaMsg">Sugerencia de optimización disponible.</span></span>
    </div>

    <div class="input-row">
      <button class="mic-btn" id="micBtn" title="Hablar con Alberth">🎙️</button>
      <div class="input-wrapper">
        <canvas id="waveformCanvas"></canvas>
        <input type="text" class="bar-input" id="barInput" placeholder="Escribe o habla (Cmd+Shift+A)..." autofocus />
        <div class="autocomplete-dropdown" id="autoDropdown"></div>
      </div>
      <button class="send-btn" id="sendBtn">Enviar</button>
    </div>

    <div class="history-list" id="historyList"></div>
    <div class="qa-history-drawer" id="qaHistoryDrawer"></div>
  </div>

  <script>
    // Service Worker Registration for PWA Offline UI
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/assets/panel/sw.js').catch(() => {});
    }

    const bar = document.getElementById('bar');
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const focusBtn = document.getElementById('focusBtn');
    const privacyBadge = document.getElementById('privacyBadge');
    const qaToast = document.getElementById('qaToast');
    const qaSevTag = document.getElementById('qaSevTag');
    const qaMsg = document.getElementById('qaMsg');
    const barInput = document.getElementById('barInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const historyList = document.getElementById('historyList');
    const autoDropdown = document.getElementById('autoDropdown');

    // Autocomplete Suggestions List
    const SUGGESTIONS = [
      { cmd: 'qué hora es', tag: 'CACHE' },
      { cmd: 'activa la cámara', tag: 'VISIÓN' },
      { cmd: 'te presento a mi hija Danna', tag: 'ENROLL' },
      { cmd: 'modo personal', tag: 'CONTEXTO' },
      { cmd: 'modo laboral', tag: 'CONTEXTO' },
      { cmd: 'modo confidencial', tag: 'PRIVACIDAD' },
      { cmd: 'activa el copiloto de pantalla', tag: 'SCREEN' },
      { cmd: 'alberth aprende que...', tag: 'LEARN' }
    ];

    // Focus Mode Toggle (Cmd+Shift+F)
    let isFocusMode = false;
    focusBtn.addEventListener('click', toggleFocusMode);
    function toggleFocusMode() {
      isFocusMode = !isFocusMode;
      bar.classList.toggle('focus-mode', isFocusMode);
      focusBtn.innerText = isFocusMode ? 'FOCUS ON' : 'FOCUS';
    }

    // Spotlight Autocomplete Handler
    barInput.addEventListener('input', () => {
      const val = barInput.value.toLowerCase().trim();
      if (!val) { autoDropdown.classList.remove('visible'); return; }
      const matches = SUGGESTIONS.filter(s => s.cmd.toLowerCase().includes(val));
      if (matches.length === 0) { autoDropdown.classList.remove('visible'); return; }

      autoDropdown.innerHTML = matches.map(m => `
        <div class="autocomplete-item" onclick="selectSuggestion('${m.cmd}')">
          <span>${m.cmd}</span>
          <span class="autocomplete-tag">${m.tag}</span>
        </div>
      `).join('');
      autoDropdown.classList.add('visible');
    });

    window.selectSuggestion = function(cmd) {
      barInput.value = cmd;
      autoDropdown.classList.remove('visible');
      barInput.focus();
    };

    // Audio Haptics Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function appendBubble(role, text) {
      const b = document.createElement('div');
      b.className = `chat-bubble ${role}`;
      b.innerText = text;
      historyList.appendChild(b);
      historyList.scrollTop = historyList.scrollHeight;
    }

    ws.onopen = () => {
      statusDot.className = 'dot';
      statusText.innerText = 'Alberth Conectado';
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'thinking') {
        statusDot.className = data.active ? 'dot thinking' : 'dot speaking';
        statusText.innerText = data.active ? 'Pensando (NEXUS)...' : 'Respondiendo...';
      } else if (data.type === 'message' && data.message.role === 'alberth') {
        statusDot.className = 'dot';
        statusText.innerText = 'Alberth Listo';
        appendBubble('alberth', data.message.content);
        playBeep(520, 'sine', 0.12);
      } else if (data.type === 'qa_alert') {
        const sev = data.severity || 'advertencia';
        qaToast.className = `qa-toast visible ${sev}`;
        qaSevTag.innerText = sev === 'critico' ? '🔴 QA CRÍTICO:' : (sev === 'sugerencia' ? '🔵 QA SUGERENCIA:' : '⚠️ QA ADVERTENCIA:');
        qaMsg.innerText = data.text;
        playBeep(sev === 'critico' ? 300 : 500, 'sawtooth', 0.2);
        setTimeout(() => qaToast.classList.remove('visible'), 8000);
      }
    };

    function sendQuery() {
      const text = barInput.value.trim();
      if (!text) return;
      autoDropdown.classList.remove('visible');

      if (text.toLowerCase().includes("modo confidencial")) {
        privacyBadge.classList.add('visible');
        bar.classList.add('privacy-mode');
        appendBubble('alberth', '🛡️ Modo Confidencial Activado. Auditoría pausada.');
        barInput.value = '';
        return;
      }

      appendBubble('user', text);
      playBeep(660, 'triangle', 0.06);
      ws.send(JSON.stringify({ type: 'text', text }));
      barInput.value = '';
    }

    sendBtn.addEventListener('click', sendQuery);
    barInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendQuery();
    });

    // Voice STT Activation
    let isListening = false;
    micBtn.addEventListener('click', () => {
      isListening = !isListening;
      micBtn.classList.toggle('active', isListening);
      bar.classList.toggle('listening-mode', isListening);
      if (isListening) {
        playBeep(700, 'sine', 0.1);
        statusText.innerText = 'Escuchando STT (Naranja)...';
        statusDot.className = 'dot listening';
      } else {
        statusText.innerText = 'Alberth Conectado';
        statusDot.className = 'dot';
      }
    });

    // Global Hotkeys: Cmd+Shift+A (Focus Input), Cmd+Shift+F (Focus Mode)
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyA') {
        e.preventDefault();
        barInput.focus();
        playBeep(800, 'sine', 0.05);
      } else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyF') {
        e.preventDefault();
        toggleFocusMode();
      }
    });
  </script>
</body>
</html>
