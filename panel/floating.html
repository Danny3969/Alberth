<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alberth Floating Bar v4.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00d4ff;
      --cyan-glow: rgba(0, 212, 255, 0.25);
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.35);
      --bg-glass: rgba(10, 18, 32, 0.90);
      --border-glass: rgba(0, 212, 255, 0.2);
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --green: #10b981;
      --red: #ef4444;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: transparent;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      height: 100vh;
      overflow: hidden;
    }

    /* Floating Bar Overlay Container */
    .floating-bar {
      width: 560px;
      max-width: 94vw;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--cyan-glow);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: floatIn 0.3s ease-out;
    }

    .floating-bar.listening-mode {
      border-color: var(--orange);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--orange-glow);
    }

    .floating-bar.privacy-mode {
      border-color: var(--red);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px rgba(239, 68, 68, 0.4);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header Bar: Status Dots & Mode Badge */
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: all 0.2s ease;
    }
    .dot.listening { background: var(--orange); box-shadow: 0 0 12px var(--orange); animation: pulse 0.8s infinite; }
    .dot.thinking { background: var(--purple); box-shadow: 0 0 10px var(--purple); animation: pulse 1s infinite; }
    .dot.speaking { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.offline { background: #64748b; box-shadow: 0 0 6px #64748b; }
    .dot.alert { background: var(--red); box-shadow: 0 0 12px var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-badge {
      background: rgba(0, 212, 255, 0.1);
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .privacy-badge {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 10px;
      display: none;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .privacy-badge.visible { display: inline-block; }

    /* QA Alert Banner Toast */
    .qa-toast {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: slideDown 0.25s ease;
    }
    .qa-toast.visible { display: flex; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Main Input Form & Audio Waveform */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .mic-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
    }

    .mic-btn.active {
      background: rgba(249, 115, 22, 0.25);
      border-color: var(--orange);
      color: var(--orange);
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .bar-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      z-index: 2;
    }

    .bar-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    /* Waveform Canvas inside input */
    #waveformCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.65;
    }

    .send-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--cyan);
      color: #060a14;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #38bdf8;
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    /* Scrollable History List */
    .history-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .chat-bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      max-width: 90%;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.25);
      color: var(--text);
    }

    .chat-bubble.alberth {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--cyan);
      color: rgba(255, 255, 255, 0.92);
    }

    /* Canvas Drawer */
    .canvas-drawer {
      background: rgba(0, 212, 255, 0.05);
      border: 1px dashed var(--border-glass);
      border-radius: 10px;
      padding: 12px;
      display: none;
    }
    .canvas-drawer.active { display: block; }
  </style>
</head>
<body>

  <div class="floating-bar" id="bar">
    <div class="bar-header">
      <div class="status-indicator">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Alberth Conectado</span>
      </div>
      <div class="badge-group">
        <span class="privacy-badge" id="privacyBadge">🛡️ CONFIDENCIAL</span>
        <span class="mode-badge" id="modeBadge">LABORAL</span>
      </div>
    </div>

    <!-- QA Alert Toast -->
    <div class="qa-toast" id="qaToast">
      <span>⚠️ <b>Agente QA:</b> <span id="qaMsg">Se ha detectado una sugerencia de optimización.</span></span>
    </div>

    <div class="input-row">
      <button class="mic-btn" id="micBtn" title="Hablar con Alberth">🎙️</button>
      <div class="input-wrapper">
        <canvas id="waveformCanvas"></canvas>
        <input type="text" class="bar-input" id="barInput" placeholder="Pregunta a Alberth (Cmd+Shift+A)..." autofocus />
      </div>
      <button class="send-btn" id="sendBtn">Enviar</button>
    </div>

    <div class="history-list" id="historyList"></div>
    <div class="canvas-drawer" id="canvasDrawer"></div>
  </div>

  <script>
    const bar = document.getElementById('bar');
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const privacyBadge = document.getElementById('privacyBadge');
    const qaToast = document.getElementById('qaToast');
    const qaMsg = document.getElementById('qaMsg');
    const barInput = document.getElementById('barInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const historyList = document.getElementById('historyList');
    const canvasDrawer = document.getElementById('canvasDrawer');

    // Waveform Canvas Setup
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    let isListening = false;
    let animFrame = null;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawWaveform() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!isListening) return;

      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#f97316';
      const width = canvas.width;
      const height = canvas.height;
      const time = Date.now() * 0.005;

      ctx.moveTo(0, height / 2);
      for (let x = 0; x < width; x += 5) {
        const y = height / 2 + Math.sin(x * 0.05 + time) * 6 * Math.sin(x * 0.01 + time);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      animFrame = requestAnimationFrame(drawWaveform);
    }

    // Audio Haptics Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function appendBubble(role, text) {
      const b = document.createElement('div');
      b.className = `chat-bubble ${role}`;
      b.innerText = text;
      historyList.appendChild(b);
      historyList.scrollTop = historyList.scrollHeight;
    }

    ws.onopen = () => {
      statusDot.className = 'dot';
      statusText.innerText = 'Alberth Conectado';
      playBeep(880, 'sine', 0.1);
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'thinking') {
        if (data.active) {
          statusDot.className = 'dot thinking';
          statusText.innerText = 'Pensando (Agente Código)...';
        } else {
          statusDot.className = 'dot speaking';
          statusText.innerText = 'Respondiendo...';
        }
      } else if (data.type === 'message') {
        if (data.message.role === 'alberth') {
          statusDot.className = 'dot';
          statusText.innerText = 'Alberth Listo';
          appendBubble('alberth', data.message.content);
          playBeep(520, 'sine', 0.12);
        }
      } else if (data.type === 'qa_alert') {
        qaMsg.innerText = data.text;
        qaToast.classList.add('visible');
        statusDot.className = 'dot alert';
        playBeep(350, 'sawtooth', 0.2);
        setTimeout(() => qaToast.classList.remove('visible'), 8000);
      } else if (data.type === 'canvas_update') {
        canvasDrawer.innerHTML = data.canvas.html;
        canvasDrawer.classList.add('active');
      }
    };

    function sendQuery() {
      const text = barInput.value.trim();
      if (!text) return;

      // Smart Privacy Mode Trigger Check ("modo confidencial")
      if (text.toLowerCase().includes("modo confidencial") || text.toLowerCase().includes("modo privacidad")) {
        privacyBadge.classList.add('visible');
        bar.classList.add('privacy-mode');
        appendBubble('alberth', '🛡️ Modo Confidencial Activado. Auditoría pausada y datos sensibles encriptados.');
        barInput.value = '';
        return;
      }

      appendBubble('user', text);
      playBeep(660, 'triangle', 0.06);
      ws.send(JSON.stringify({ type: 'text', text }));
      barInput.value = '';
    }

    sendBtn.addEventListener('click', sendQuery);
    barInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendQuery();
    });

    // Voice Mic STT Activation with Orange Theme Waveform
    micBtn.addEventListener('click', () => {
      isListening = !isListening;
      micBtn.classList.toggle('active', isListening);
      bar.classList.toggle('listening-mode', isListening);
      if (isListening) {
        playBeep(700, 'sine', 0.1);
        statusText.innerText = 'Escuchando STT (Naranja)...';
        statusDot.className = 'dot listening';
        drawWaveform();
      } else {
        statusText.innerText = 'Alberth Conectado';
        statusDot.className = 'dot';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    });

    // Global Hotkey (Cmd+Shift+A)
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyA') {
        e.preventDefault();
        barInput.focus();
        playBeep(800, 'sine', 0.05);
      }
    });
  </script>
</body>
</html>
